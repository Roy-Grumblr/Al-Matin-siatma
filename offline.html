<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Offline - SIATMA</title>
  <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
  <style>
    html.dark body { background-color: #0f172a; color: #e2e8f0; }
    html.dark h1 { color: #f1f5f9; }
    html.dark p { color: #cbd5e1; }
    html.dark .offline-icon { color: #94a3b8; }
    html.dark .retry-link { background-color: #1d4ed8; }
    html.dark .retry-link:hover { background-color: #1e40af; }
    html.dark .home-link { border-color: #475569; background-color: #1e293b; color: #e2e8f0; }
    html.dark .home-link:hover { background-color: #334155; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="max-w-md text-center">
    <img src="assets/logo-tk.png" alt="TK Al-Matin" class="h-16 mx-auto">
    <img src="assets/logo-unpam.png" alt="Universitas Pamulang" class="h-10 mx-auto mt-2">
    <svg class="offline-icon mt-6 h-16 w-16 mx-auto text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
    </svg>
    <h1 class="mt-4 text-2xl font-bold text-slate-800">Koneksi Terputus</h1>
    <p class="mt-2 text-slate-600">SIATMA membutuhkan koneksi internet. Periksa jaringan Anda dan coba lagi.</p>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <button onclick="location.reload()" class="retry-link rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Coba Lagi</button>
      <a href="index.html" class="home-link rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-100">Kembali ke Beranda</a>
    </div>
  </div>
</body>
</html>
