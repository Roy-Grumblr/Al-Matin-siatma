<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard SIATMA - Sistem Informasi Akademik TK Al-Matin" />
    <title>Dashboard | SIATMA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-bg font-Inter text-text antialiased">
    <div id="sidebar"></div>

    <div class="ml-64">
      <div id="header"></div>

      <main class="min-h-screen bg-bg p-6">
        <section class="mb-6">
          <h2 class="text-2xl font-bold">Selamat datang, Admin</h2>
          <p class="mt-1 text-text-muted">Kelola aktivitas akademik TK Al-Matin dengan mudah.</p>
        </section>

        <section id="statCards" class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></section>

        <section class="mb-6 grid grid-cols-1 gap-6 xl:grid-cols-3">
          <article class="rounded-2xl bg-white p-6 shadow-sm xl:col-span-2">
            <div class="flex items-center justify-between gap-4">
              <div>
                <h3 class="text-lg font-semibold">Absensi Hari Ini</h3>
                <p class="mt-1 text-sm text-text-muted">Rekap kehadiran seluruh siswa</p>
              </div>
              <span class="rounded-full bg-primary/10 px-3 py-1 text-sm font-semibold text-primary">24 September 2026</span>
            </div>
            <div id="attendanceSummary" class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>
            <div class="mt-8">
              <div class="mb-3 flex items-center justify-between text-sm">
                <span class="font-medium text-text-muted">Perbandingan status</span>
                <span class="text-text-muted">Jumlah siswa</span>
              </div>
              <div id="attendanceChart" class="flex h-44 items-end justify-around gap-4 border-b border-slate-200 px-4"></div>
            </div>
          </article>

          <article class="rounded-2xl bg-white p-6 shadow-sm">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-semibold">Pengumuman Terbaru</h3>
              <span class="rounded-full bg-accent/10 px-2.5 py-1 text-xs font-semibold text-accent">3 terbaru</span>
            </div>
            <div id="announcements" class="mt-5 divide-y divide-slate-100"></div>
          </article>
        </section>

        <section class="rounded-2xl bg-white p-6 shadow-sm">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-semibold">Aktivitas Terbaru</h3>
              <p class="mt-1 text-sm text-text-muted">Aktivitas terakhir di sistem SIATMA</p>
            </div>
            <span class="rounded-full bg-secondary/10 px-3 py-1 text-xs font-semibold text-secondary">Live</span>
          </div>
          <div id="activities" class="mt-6 grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-4"></div>
        </section>
      </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script>
      (function () {
        var stats = SIATMA_DATA.dashboardStats || {
          totalSiswa: 85,
          totalGuru: 8,
          totalKelas: 5,
          kehadiranHariIni: 72,
          absensiHariIni: { hadir: 72, sakit: 6, izin: 5, alpa: 2 },
        };
        var announcements = SIATMA_DATA.announcements.slice(0, 3);
        var activities = [
          { title: "Data siswa baru ditambahkan", time: "5 menit lalu", type: "student", color: "bg-primary" },
          { title: "Absensi kelas TK A diperbarui", time: "1 jam lalu", type: "attendance", color: "bg-secondary" },
          { title: "Pengumuman baru dibuat", time: "2 jam lalu", type: "announcement", color: "bg-accent" },
          { title: "Data guru diperbarui", time: "3 jam lalu", type: "teacher", color: "bg-violet-500" },
        ];

        

        var statItems = [
          { label: "Total Siswa", value: stats.totalSiswa, tone: "primary", icon: "👥" },
          { label: "Total Guru", value: stats.totalGuru, tone: "secondary", icon: "👩‍🏫" },
          { label: "Total Kelas", value: stats.totalKelas, tone: "accent", icon: "🏫" },
          { label: "Kehadiran Hari Ini", value: stats.kehadiranHariIni, tone: "violet", icon: "✓" },
        ];

        document.getElementById("statCards").innerHTML = statItems
          .map(function (item) {
            var toneClasses = {
              primary: "bg-primary/10 text-primary",
              secondary: "bg-secondary/10 text-secondary",
              accent: "bg-accent/10 text-accent",
              violet: "bg-violet-100 text-violet-600",
            };
            return '<article class="rounded-2xl bg-white p-5 shadow-sm"><div class="flex items-start justify-between"><div><p class="text-sm text-text-muted">' +
              item.label +
              '</p><p class="mt-2 text-3xl font-bold">' +
              item.value +
              '</p></div><div class="flex h-11 w-11 items-center justify-center rounded-xl text-lg ' +
              toneClasses[item.tone] +
              '">' +
              item.icon +
              "</div></div></article>";
          })
          .join("");

        var attendanceItems = [
          { label: "Hadir", value: stats.absensiHariIni.hadir, className: "bg-green-50 text-green-700" },
          { label: "Sakit", value: stats.absensiHariIni.sakit, className: "bg-yellow-50 text-yellow-700" },
          { label: "Izin", value: stats.absensiHariIni.izin, className: "bg-blue-50 text-blue-700" },
          { label: "Alpa", value: stats.absensiHariIni.alpa, className: "bg-red-50 text-red-700" },
        ];
        var maxAttendance = Math.max.apply(null, attendanceItems.map(function (item) { return item.value; }));

        document.getElementById("attendanceSummary").innerHTML = attendanceItems
          .map(function (item) {
            return '<div class="rounded-xl p-4 ' +
              item.className +
              '"><p class="text-sm">' +
              item.label +
              '</p><p class="mt-1 text-2xl font-bold">' +
              item.value +
              "</p></div>";
          })
          .join("");

        document.getElementById("attendanceChart").innerHTML = attendanceItems
          .map(function (item) {
            var height = Math.max(12, Math.round((item.value / maxAttendance) * 100));
            return '<div class="flex h-full flex-1 flex-col items-center justify-end gap-2"><span class="text-xs font-semibold text-text-muted">' +
              item.value +
              '</span><div class="w-full max-w-14 rounded-t-lg bg-primary transition-all" style="height:' +
              height +
              '%" title="' +
              item.label +
              ' ' +
              item.value +
              '"></div><span class="text-xs text-text-muted">' +
              item.label +
              "</span></div>";
          })
          .join("");

        document.getElementById("announcements").innerHTML = announcements
          .map(function (item) {
            return '<article class="py-4 first:pt-0 last:pb-0"><div class="flex items-start justify-between gap-3"><h4 class="text-sm font-semibold">' +
              item.judul +
              '</h4><span class="shrink-0 text-xs text-text-muted">' +
              item.tanggal +
              '</span></div><p class="mt-2 line-clamp-2 text-sm leading-6 text-text-muted">' +
              item.isi +
              "</p></article>";
          })
          .join("");

        document.getElementById("activities").innerHTML = activities
          .map(function (item) {
            return '<article class="relative rounded-xl border border-slate-100 p-4"><div class="mb-4 flex items-center gap-3"><span class="h-3 w-3 rounded-full ' +
              item.color +
              '"></span><span class="text-xs text-text-muted">' +
              item.time +
              '</span></div><p class="text-sm font-medium leading-6">' +
              item.title +
              "</p></article>";
          })
          .join("");
      })();
    </script>
    <script>
      SIATMA_LAYOUT.initLayout({
        role: "admin",
        activeMenu: "dashboard",
        title: "Dashboard",
        breadcrumb: "Dashboard",
      });
    </script>
  </body>
</html>
