<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
    <style>
      html.dark { background-color: #0f172a; color: #e2e8f0; }
      html.dark body { background-color: #0f172a; }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo-tk.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard SIATMA - Sistem Informasi Akademik TK Al-Matin" />
    <title>Dashboard | SIATMA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "dark-surface": "#1E293B",
              "dark-bg": "#0F172A",
              "dark-border": "#334155",
              "dark-text": "#F1F5F9",
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
      <style>main{animation:fadeIn .3s ease-in}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
  <style>
html.dark body{background-color:#0f172a!important;color:#e2e8f0!important}
html.dark .bg-bg{background-color:#0f172a!important}
html.dark .bg-white,html.dark .bg-card{background-color:#1e293b!important}
html.dark .bg-slate-50,html.dark .bg-gray-50{background-color:#334155!important}
html.dark .text-text{color:#f1f5f9!important}
html.dark .text-text-muted{color:#94a3b8!important}
html.dark .text-slate-500,html.dark .text-slate-600,html.dark .text-slate-700,html.dark .text-gray-500,html.dark .text-gray-600,html.dark .text-gray-700{color:#cbd5e1!important}
html.dark .border-slate-100,html.dark .border-slate-200,html.dark .border-slate-300,html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#334155!important}
html.dark input:not([type=radio]):not([type=checkbox]),html.dark select,html.dark textarea{background-color:#1e293b;color:#f1f5f9;border-color:#475569}
html.dark input::placeholder,html.dark textarea::placeholder{color:#94a3b8}
html.dark .hover\:bg-slate-50:hover{background-color:#334155!important}
</style>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

   <body class="min-h-screen bg-bg dark:bg-slate-900 font-Inter text-text dark:text-slate-100 antialiased">
    <div id="sidebar"></div>

    <div class="ml-64">
      <div id="header"></div>

      <main class="min-h-screen bg-bg dark:bg-slate-900 p-6">
        <section class="mb-6">
          <h2 class="text-2xl font-bold">Selamat datang, Admin</h2>
          <p class="mt-1 text-text-muted dark:text-slate-400">Kelola aktivitas akademik TK Al-Matin dengan mudah.</p>
        </section>

        <section id="statCards" class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></section>

        <section class="mb-6 grid grid-cols-1 gap-6 xl:grid-cols-3">
          <article class="rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm xl:col-span-2">
            <div class="flex items-center justify-between gap-4">
              <div>
                <h3 class="text-lg font-semibold">Absensi Hari Ini</h3>
                <p class="mt-1 text-sm text-text-muted dark:text-slate-400">Rekap kehadiran seluruh siswa</p>
              </div>
              <span id="attendance-date" class="rounded-full bg-primary/10 px-3 py-1 text-sm font-semibold text-primary"></span>
            </div>
            <div id="attendanceSummary" class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>
            <div class="mt-8">
              <div class="mb-3 flex items-center justify-between text-sm">
                <span class="font-medium text-text-muted dark:text-slate-400">Perbandingan status</span>
                <span class="text-text-muted dark:text-slate-400">Jumlah siswa</span>
              </div>
              <canvas id="attendanceChart" class="max-h-56 w-full"></canvas>
            </div>
          </article>

          <article class="rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-semibold">Pengumuman Terbaru</h3>
              <span class="rounded-full bg-accent/10 px-2.5 py-1 text-xs font-semibold text-accent">3 terbaru</span>
            </div>
            <div id="announcements" class="mt-5 divide-y divide-slate-100"></div>
          </article>
        </section>

        <section class="rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-semibold">Aktivitas Terbaru</h3>
              <p class="mt-1 text-sm text-text-muted dark:text-slate-400">Aktivitas terakhir di sistem SIATMA</p>
            </div>
            <span class="rounded-full bg-secondary/10 px-3 py-1 text-xs font-semibold text-secondary">Live</span>
          </div>
          <div id="activities" class="mt-6 grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-4"></div>
        </section>
      </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/network-status.js"></script>
    <script src="../js/ui-helpers.js"></script>
    <script src="../js/layout.js"></script>
    <script>
      (function () {
        var stats = {
          totalSiswa: SIATMA_DATA.students.length,
          totalGuru: SIATMA_DATA.teachers.length,
          totalKelas: SIATMA_DATA.classes.length,
          kehadiranHariIni: SIATMA_DATA.attendance.filter(function(a) { return a.status === 'Hadir'; }).length,
          absensiHariIni: {
            hadir: SIATMA_DATA.attendance.filter(function(a) { return a.status === 'Hadir'; }).length,
            sakit: SIATMA_DATA.attendance.filter(function(a) { return a.status === 'Sakit'; }).length,
            izin: SIATMA_DATA.attendance.filter(function(a) { return a.status === 'Izin'; }).length,
            alpa: SIATMA_DATA.attendance.filter(function(a) { return a.status === 'Alpa'; }).length
          }
        };
        var announcements = SIATMA_DATA.announcements.slice(0, 3);
        document.getElementById("attendance-date").textContent = SIATMA_UI.formatDate(new Date(), "long");
        var activities = [
          { title: "Data siswa baru ditambahkan", time: "5 menit lalu", type: "student", color: "bg-primary" },
          { title: "Absensi kelas TK A diperbarui", time: "1 jam lalu", type: "attendance", color: "bg-secondary" },
          { title: "Pengumuman baru dibuat", time: "2 jam lalu", type: "announcement", color: "bg-accent" },
          { title: "Data guru diperbarui", time: "3 jam lalu", type: "teacher", color: "bg-violet-500" },
        ];

        

        var statCards = document.getElementById("statCards");
        var announcementsList = document.getElementById("announcements");
        statCards.innerHTML = SIATMA_UI.loadingState("Memuat statistik...");
        announcementsList.innerHTML = SIATMA_UI.loadingState("Memuat pengumuman...");

        window.setTimeout(function () {
        var statItems = [
          { label: "Total Siswa", value: stats.totalSiswa, tone: "primary", icon: '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.75-.824 3.75 3.75 0 0 0-4.5-5.782m.75 6.606v-.001c0-1.776-.683-3.392-1.8-4.594M18 18.72v.001c0 1.776-.683 3.392-1.8 4.594M6 18.72a9.094 9.094 0 0 1-3.75-.824 3.75 3.75 0 0 1 4.5-5.782M6 18.72v-.001c0-1.776.683-3.392 1.8-4.594M6 18.72v.001c0 1.776.683 3.392 1.8 4.594M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 2.25a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0ZM3 9a2.25 2.25 0 1 1 4.5 0A2.25 2.25 0 0 1 3 9Z"/></svg>' },
          { label: "Total Guru", value: stats.totalGuru, tone: "secondary", icon: '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m12 14.25 8.25-4.5L12 5.25l-8.25 4.5 8.25 4.5Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m6.75 11.25v4.5c3.5 2.25 7 2.25 10.5 0v-4.5m3-1.5v5.25"/></svg>' },
          { label: "Total Kelas", value: stats.totalKelas, tone: "accent", icon: '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 21V9.75L12 3l7.5 6.75V21M8.25 21v-6.75h7.5V21M8.25 9.75h.008v.008H8.25V9.75Zm3.75 0h.008v.008H12V9.75Zm3.75 0h.008v.008h-.008V9.75Z"/></svg>' },
          { label: "Kehadiran Hari Ini", value: stats.kehadiranHariIni, tone: "violet", icon: '<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m9 12.75 2.25 2.25L15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>' },
        ];

        document.getElementById("statCards").innerHTML = statItems
          .map(function (item) {
            var toneClasses = {
              primary: "bg-primary/10 text-primary",
              secondary: "bg-secondary/10 text-secondary",
              accent: "bg-accent/10 text-accent",
              violet: "bg-violet-100 text-violet-600",
            };
            return '<article class="rounded-2xl bg-white dark:bg-slate-800 p-5 shadow-sm transition hover:shadow-md"><div class="flex items-start justify-between"><div><p class="text-sm text-text-muted dark:text-slate-400">' +
              item.label +
              '</p><p class="mt-2 text-3xl font-bold">' +
              item.value +
              '</p></div><div class="flex h-11 w-11 items-center justify-center rounded-xl text-lg ' +
              toneClasses[item.tone] +
              '">' +
              item.icon +
              "</div></div></article>";
          })
          .join("");

        var attendanceItems = [
          { label: "Hadir", value: stats.absensiHariIni.hadir, className: "bg-green-50 text-green-700" },
          { label: "Sakit", value: stats.absensiHariIni.sakit, className: "bg-yellow-50 text-yellow-700" },
          { label: "Izin", value: stats.absensiHariIni.izin, className: "bg-blue-50 text-blue-700" },
          { label: "Alpa", value: stats.absensiHariIni.alpa, className: "bg-red-50 text-red-700" },
        ];
        document.getElementById("attendanceSummary").innerHTML = attendanceItems
          .map(function (item) {
            return '<div class="rounded-xl p-4 ' +
              item.className +
              '"><p class="text-sm">' +
              item.label +
              '</p><p class="mt-1 text-2xl font-bold">' +
              item.value +
              "</p></div>";
          })
          .join("");

        new Chart(document.getElementById("attendanceChart"), {
          type: 'bar',
          data: {
            labels: ['Hadir', 'Sakit', 'Izin', 'Alpa'],
            datasets: [{
              label: 'Jumlah Siswa',
              data: [stats.absensiHariIni.hadir, stats.absensiHariIni.sakit, stats.absensiHariIni.izin, stats.absensiHariIni.alpa],
              backgroundColor: ['#10B981', '#F59E0B', '#2563EB', '#EF4444'],
            }]
          },
          options: { responsive: true, plugins: { legend: { display: false } } }
        });

        document.getElementById("announcements").innerHTML = announcements
          .map(function (item) {
            return '<article class="py-4 first:pt-0 last:pb-0 transition hover:bg-slate-50 dark:hover:bg-slate-700"><div class="flex items-start justify-between gap-3"><h4 class="text-sm font-semibold">' +
              item.judul +
              '</h4><span class="shrink-0 text-xs text-text-muted dark:text-slate-400">' +
              SIATMA_UI.formatDate(item.tanggal, "short") +
              '</span></div><p class="mt-2 line-clamp-2 text-sm leading-6 text-text-muted dark:text-slate-400">' +
              item.isi +
              "</p></article>";
          })
          .join("");

        document.getElementById("activities").innerHTML = activities
          .map(function (item) {
            return '<article class="relative rounded-xl border border-slate-100 dark:border-slate-700 p-4"><div class="mb-4 flex items-center gap-3"><span class="h-3 w-3 rounded-full ' +
              item.color +
              '"></span><span class="text-xs text-text-muted dark:text-slate-400">' +
              item.time +
              '</span></div><p class="text-sm font-medium leading-6">' +
              item.title +
              "</p></article>";
          })
          .join("");
        }, 300);
      })();
    </script>
    <script>
      SIATMA_LAYOUT.initLayout({
        role: "admin",
        activeMenu: "dashboard",
        title: "Dashboard",
        breadcrumb: "Home / Dashboard",
      });
    </script>
      <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){var workerPath=/\/(?:admin|guru|orangtua)\//.test(location.pathname)?'../service-worker.js':'service-worker.js';navigator.serviceWorker.register(workerPath).catch(function(error){console.error('Service worker registration failed:',error)})})}</script>
  </body>
</html>
