    <script>
    (function() {
      var classSelect = document.getElementById('report-class');
      var showButton = document.getElementById('show-report');
      var periodSelect = document.getElementById('report-period');
      var typeSelect = document.getElementById('report-type');
      var tbody = document.querySelector('table tbody');
      var thead = document.querySelector('table thead');
      var printPeriod = document.getElementById('print-period');
      var previewSubtitle = document.getElementById('report-preview-subtitle');

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      classSelect.innerHTML = '<option value="Semua">Semua</option>' +
        Array.from(new Set(SIATMA_DATA.classes.map(function(kelas) { return kelas.nama; }))).map(function(name) {
          return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
        }).join('');

      function getPeriodRange() {
        var period = periodSelect.value;
        var today = new Date();
        var end = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 23, 59, 59, 999);
        var start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        if (period === 'Bulan Ini') start.setDate(1);
        else if (period === '3 Bulan Terakhir') start.setMonth(today.getMonth() - 3);
        else if (period === 'Semester') start.setMonth(today.getMonth() - 6);
        else if (period === 'Tahun Ajaran') start.setMonth(today.getMonth() - 12);
        return { start: start, end: end };
      }

      function renderTable(headers, rows) {
        thead.innerHTML = '<tr>' + headers.map(function(header) {
          return '<th class="px-6 py-4">' + escapeHtml(header) + '</th>';
        }).join('') + '</tr>';
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="' + headers.length + '" class="p-0">' + SIATMA_UI.emptyState({
            title: 'Data tidak ditemukan',
            description: 'Tidak ada data yang sesuai dengan filter.'
          }) + '</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(function(row) {
          return '<tr class="hover:bg-slate-50 dark:hover:bg-slate-700">' + row.map(function(value) {
            return '<td class="px-6 py-4">' + escapeHtml(value) + '</td>';
          }).join('') + '</tr>';
        }).join('');
      }

      function renderAttendanceReport(students) {
        var range = getPeriodRange();
        var rows = students.map(function(student) {
          var studentAttendance = SIATMA_DATA.attendance.filter(function(record) {
            if (record.studentId !== student.id) return false;
            var parts = record.tanggal.split('-').map(Number);
            var date = new Date(parts[0], parts[1] - 1, parts[2]);
            return date >= range.start && date <= range.end;
          });
          var counts = { Hadir: 0, Sakit: 0, Izin: 0, Alpa: 0 };
          studentAttendance.forEach(function(record) {
            var status = record.status.charAt(0).toUpperCase() + record.status.slice(1).toLowerCase();
            if (Object.prototype.hasOwnProperty.call(counts, status)) counts[status] += 1;
          });
          var attendanceRate = studentAttendance.length
            ? Math.round(counts.Hadir / studentAttendance.length * 100)
            : 0;

          return [student.nama, counts.Hadir, counts.Sakit, counts.Izin, counts.Alpa, attendanceRate + '%'];
        });
        renderTable(['Nama', 'Hadir', 'Sakit', 'Izin', 'Alpa', '% Kehadiran'], rows);
      }

      function renderCurrentReport() {
        var selectedClass = classSelect.value;
        var reportType = typeSelect.value;
        var selectedStudents = SIATMA_DATA.students.filter(function(student) {
          return selectedClass === 'Semua' || student.kelas === selectedClass;
        });
        var selectedTeachers = SIATMA_DATA.teachers.filter(function(teacher) {
          return selectedClass === 'Semua' || teacher.kelas === selectedClass;
        });
        var selectedClasses = SIATMA_DATA.classes.filter(function(kelas) {
          return selectedClass === 'Semua' || kelas.nama === selectedClass;
        });

        if (reportType === 'Rekap Absensi') {
          renderAttendanceReport(selectedStudents);
        } else if (reportType === 'Laporan Data Siswa') {
          renderTable(['NIS', 'Nama Siswa', 'Kelas', 'Status'], selectedStudents.map(function(student) {
            return [student.nis, student.nama, student.kelas, student.status];
          }));
        } else if (reportType === 'Data Guru') {
          renderTable(['ID Guru', 'Nama Guru', 'Email', 'Kelas', 'Status'], selectedTeachers.map(function(teacher) {
            return [teacher.nip, teacher.nama, teacher.email, teacher.kelas, teacher.status];
          }));
        } else {
          renderTable(['Kelas', 'Guru Pengampu', 'Jumlah Siswa', 'Status'], selectedClasses.map(function(kelas) {
            var studentsInClass = SIATMA_DATA.students.filter(function(student) { return student.kelas === kelas.nama; }).length;
            return [kelas.nama, kelas.guru || 'Belum ditentukan', studentsInClass, kelas.status];
          }));
        }
        var summary = reportType + ' - ' + periodSelect.value + ' - Kelas ' + selectedClass;
        printPeriod.textContent = summary;
        previewSubtitle.textContent = summary;
      }

      document.querySelectorAll('.report-type-card').forEach(function(card) {
        card.addEventListener('click', function() {
          typeSelect.value = card.dataset.reportType;
          renderCurrentReport();
        });
      });
      showButton.addEventListener('click', renderCurrentReport);
      typeSelect.addEventListener('change', renderCurrentReport);
      classSelect.addEventListener('change', renderCurrentReport);
      periodSelect.addEventListener('change', renderCurrentReport);
      window.addEventListener('beforeprint', renderCurrentReport);
      document.getElementById('print-report').addEventListener('click', function () {
        renderCurrentReport();
        window.print();
      });
      renderCurrentReport();
    })();
    </script>
    <script>
    (function() {
      var reportTable = document.querySelector('table');
      var exportExcel = document.getElementById('export-excel');
      var exportPdf = document.getElementById('export-pdf');
      var typeSelect = document.getElementById('report-type');

      exportExcel.addEventListener('click', function() {
        function escapeCSV(value) {
          var str = String(value == null ? '' : value);
          if (/^[=+\-@]/.test(str)) str = "'" + str;
          return '"' + str.replace(/"/g, '""') + '"';
        }
        var rows = Array.from(reportTable.querySelectorAll('tr')).map(function(row) {
          return Array.from(row.querySelectorAll('th, td')).map(function(cell) {
            return escapeCSV(cell.textContent.trim());
          }).join(',');
        });
        var csv = '\uFEFF' + rows.join('\r\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'laporan-' + typeSelect.value.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + new Date().toISOString().split('T')[0] + '.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        SIATMA_TOAST.success('Laporan berhasil diexport');
      });

      exportPdf.addEventListener('click', function () {
        if (!window.jspdf) {
          SIATMA_TOAST.error('Library PDF belum siap. Coba lagi.');
          return;
        }
        var doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        doc.setFontSize(16);
        doc.text('TK Al-Matin', 14, 15);
        doc.setFontSize(11);
        doc.text(typeSelect.value + ' — ' + SIATMA_UI.formatDate(new Date(), 'long'), 14, 22);

        doc.autoTable({
          startY: 28,
          head: [Array.from(document.querySelectorAll('table thead th')).map(function(cell) { return cell.textContent.trim(); })],
          body: Array.from(document.querySelectorAll('table tbody tr')).map(function (row) {
            return Array.from(row.querySelectorAll('td')).map(function (cell) {
              return cell.textContent.trim();
            });
          }),
          theme: 'grid',
          styles: { fontSize: 9 },
          headStyles: { fillColor: [37, 99, 235] }
        });

        doc.save('laporan-' + typeSelect.value.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + new Date().toISOString().split('T')[0] + '.pdf');
        SIATMA_TOAST.success('Laporan PDF berhasil diunduh');
      });
    })();
    </script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../service-worker.js').catch(function(error){console.error('Service worker registration failed:',error)})})}</script>
  </body>
