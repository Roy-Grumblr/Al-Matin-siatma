    <script>
    (function() {
      var classSelect = document.getElementById('report-class');
      var showButton = document.querySelector('main > section button');
      var periodSelect = document.getElementById('report-period');
      var tbody = document.querySelector('table tbody');
      var printPeriod = document.getElementById('print-period');

      function renderReport(students) {
        if (!students.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-0">' + SIATMA_UI.emptyState({
            title: 'Data siswa tidak ditemukan',
            description: 'Tidak ada data untuk kelas yang dipilih.'
          }) + '</td></tr>';
          return;
        }

        tbody.innerHTML = students.map(function(student) {
          var studentAttendance = SIATMA_DATA.attendance.filter(function(record) {
            return record.studentId === student.id;
          });
          var counts = { Hadir: 0, Sakit: 0, Izin: 0, Alpa: 0 };
          studentAttendance.forEach(function(record) {
            var status = record.status.charAt(0).toUpperCase() + record.status.slice(1).toLowerCase();
            if (Object.prototype.hasOwnProperty.call(counts, status)) counts[status] += 1;
          });
          var attendanceRate = studentAttendance.length
            ? Math.round(counts.Hadir / studentAttendance.length * 100)
            : 0;

          return '<tr class="hover:bg-slate-50 dark:hover:bg-slate-700">' +
            '<td class="whitespace-nowrap px-6 py-4 font-medium">' + student.nama + '</td>' +
            '<td class="px-6 py-4 text-center">' + counts.Hadir + '</td>' +
            '<td class="px-6 py-4 text-center">' + counts.Sakit + '</td>' +
            '<td class="px-6 py-4 text-center">' + counts.Izin + '</td>' +
            '<td class="px-6 py-4 text-center">' + counts.Alpa + '</td>' +
            '<td class="px-6 py-4 text-right font-medium text-secondary">' + attendanceRate + '%</td>' +
            '</tr>';
        }).join('');
      }

      showButton.addEventListener('click', function() {
        renderCurrentReport();
      });

      function renderCurrentReport() {
        var selectedClass = classSelect.value;
        var filteredStudents = SIATMA_DATA.students.filter(function(student) {
          return selectedClass === 'Semua' || student.kelas === selectedClass;
        });
        renderReport(filteredStudents);
        printPeriod.textContent = 'Laporan Absensi - ' + periodSelect.value + ' - Kelas ' + selectedClass;
      }

      window.addEventListener('beforeprint', renderCurrentReport);
      document.getElementById('print-report').addEventListener('click', function () {
        renderCurrentReport();
        window.print();
      });
      renderCurrentReport();
    })();
    </script>
    <script>
    (function() {
      var reportTable = document.querySelector('table');
      var exportExcel = document.getElementById('export-excel');
      var exportPdf = document.getElementById('export-pdf');

      exportExcel.addEventListener('click', function() {
        function escapeCSV(value) {
          var str = String(value == null ? '' : value);
          if (/^[=+\-@]/.test(str)) str = "'" + str;
          return '"' + str.replace(/"/g, '""') + '"';
        }
        var rows = Array.from(reportTable.querySelectorAll('tr')).map(function(row) {
          return Array.from(row.querySelectorAll('th, td')).map(function(cell) {
            return escapeCSV(cell.textContent.trim());
          }).join(',');
        });
        var csv = '\uFEFF' + rows.join('\r\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'laporan-absensi-' + new Date().toISOString().split('T')[0] + '.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        SIATMA_TOAST.success('Laporan berhasil diexport');
      });

      exportPdf.addEventListener('click', function() {
        var printWindow = window.open('', '_blank');
        if (!printWindow) {
          SIATMA_TOAST.error('Jendela export PDF diblokir browser');
          return;
        }
        printWindow.document.open();
        printWindow.document.write('<!DOCTYPE html><html><head><title>Laporan Absensi</title><style>body{font-family:Arial,sans-serif;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}th{text-transform:uppercase;background:#f1f5f9}</style></head><body><h1>Laporan Absensi</h1>' + reportTable.outerHTML + '</body></html>');
        printWindow.document.close();
        window.setTimeout(function() {
          printWindow.print();
        }, 250);
      });
    })();
    </script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../service-worker.js').catch(function(error){console.error('Service worker registration failed:',error)})})}</script>
