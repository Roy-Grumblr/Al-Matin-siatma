<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
    <style>
      html.dark { background-color: #0f172a; color: #e2e8f0; }

    </style>
    <link rel="icon" type="image/png" href="../assets/logo-tk.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "dark-surface": "#1E293B",
              "dark-bg": "#0F172A",
              "dark-border": "#334155",
              "dark-text": "#F1F5F9",
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
      <style>main{animation:fadeIn .3s ease-in}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
  <style>
html.dark body{background-color:#0f172a!important;color:#e2e8f0!important}
html.dark .bg-bg{background-color:#0f172a!important}
html.dark .bg-white,html.dark .bg-card{background-color:#1e293b!important}
html.dark .bg-slate-50,html.dark .bg-gray-50{background-color:#334155!important}
html.dark .text-text{color:#f1f5f9!important}
html.dark .text-text-muted{color:#94a3b8!important}
html.dark .text-slate-500,html.dark .text-slate-600,html.dark .text-slate-700,html.dark .text-gray-500,html.dark .text-gray-600,html.dark .text-gray-700{color:#cbd5e1!important}
html.dark .border-slate-100,html.dark .border-slate-200,html.dark .border-slate-300,html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#334155!important}
html.dark input:not([type=radio]):not([type=checkbox]),html.dark select,html.dark textarea{background-color:#1e293b;color:#f1f5f9;border-color:#475569}
html.dark input::placeholder,html.dark textarea::placeholder{color:#94a3b8}
html.dark .hover\:bg-slate-50:hover{background-color:#334155!important}
</style>
      <style id="global-print-styles">
      @media print {
        #sidebar, #header, .no-print, footer { display: none !important; }
        .ml-64, .ml-0 { margin-left: 0 !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; }
        .print-header { display: flex !important; }
      }
      .print-header { display: none; }
    </style>
  </head>

   <body class="min-h-screen bg-bg dark:bg-slate-900 font-Inter text-text dark:text-slate-100 antialiased">
    <div id="sidebar"></div>

    <div class="ml-64">
      <div id="header"></div>

      <main class="min-h-screen bg-bg dark:bg-slate-900 p-6">
        <div class="print-header mb-6 items-center gap-4 border-b border-slate-300 pb-4">
          <img src="../assets/logo-tk.png" alt="TK Al-Matin" class="h-16 w-auto" />
          <div class="flex-1">
            <h1 class="text-xl font-bold">TK AL-MATIN</h1>
            <p class="text-sm">Jl. Pendidikan No. 123, Jakarta | Telp: 021-1234567</p>
          </div>
          <img src="../assets/logo-unpam.png" alt="UNPAM" class="h-12 w-auto" />
        </div></main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/network-status.js"></script>
    <script src="../js/pwa-install.js"></script>
    <script src="../js/ui-helpers.js"></script>
    <script src="../js/layout.js"></script>

    <script>
      (function (callback) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', callback);
        else callback();
      })(function () {
(function () {
        const main = document.querySelector('main');
        const content = document.createElement('div');
        main.appendChild(content);
        content.innerHTML = SIATMA_UI.loadingState('Memuat data...');
        window.setTimeout(function () {
        const id = new URLSearchParams(window.location.search).get('id') || '1';
        const teacher = SIATMA.getTeacherById(id);
        const escapeHtml = (value) => String(value == null || value === '' ? '-' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

        if (!teacher) {
          content.innerHTML = SIATMA_UI.emptyState({ title: 'Guru tidak ditemukan', description: 'Data guru yang diminta tidak tersedia.' });
          return;
        }

        const initial = teacher.nama.trim().split(/\s+/).slice(0, 2).map((part) => part.charAt(0)).join('').toUpperCase();
        const statusClass = teacher.status === 'Aktif' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700';
        const classData = SIATMA_DATA.classes.find((item) => item.nama === teacher.kelas);
        content.innerHTML = '<section class="mb-4 flex flex-wrap items-center justify-between gap-6 rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm"><div class="flex items-center gap-6"><div class="flex h-24 w-24 items-center justify-center rounded-full bg-primary/10 text-2xl font-semibold text-primary">' + initial + '</div><div><h2 class="text-2xl font-bold">' + escapeHtml(teacher.nama) + '</h2><div class="mt-2 flex flex-wrap gap-3 text-sm text-text-muted dark:text-slate-400"><span>NIP: ' + escapeHtml(teacher.nip) + '</span><span>Kelas: ' + escapeHtml(teacher.kelas) + '</span><span class="rounded-full px-2 py-1 text-xs ' + statusClass + '">' + escapeHtml(teacher.status) + '</span></div></div></div><a href="tambah-guru.html?id=' + encodeURIComponent(teacher.id) + '" class="rounded-lg border border-slate-300 dark:border-slate-600 px-4 py-2.5 text-sm">Edit</a></section><div class="grid gap-4 lg:grid-cols-3"><section class="rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm lg:col-span-2"><h2 class="mb-5 text-lg font-semibold">Informasi Pribadi</h2><dl class="grid grid-cols-1 gap-x-6 gap-y-5 md:grid-cols-2"><div><dt class="text-sm text-text-muted dark:text-slate-400">ID Guru</dt><dd class="mt-1 font-medium">' + escapeHtml(teacher.nip) + '</dd></div><div><dt class="text-sm text-text-muted dark:text-slate-400">Nama Lengkap</dt><dd class="mt-1 font-medium">' + escapeHtml(teacher.nama) + '</dd></div><div><dt class="text-sm text-text-muted dark:text-slate-400">Email</dt><dd class="mt-1 font-medium">' + escapeHtml(teacher.email) + '</dd></div><div><dt class="text-sm text-text-muted dark:text-slate-400">Nomor HP</dt><dd class="mt-1 font-medium">' + escapeHtml(teacher.nomorHP) + '</dd></div><div><dt class="text-sm text-text-muted dark:text-slate-400">Kelas</dt><dd class="mt-1 font-medium">' + escapeHtml(teacher.kelas) + '</dd></div><div><dt class="text-sm text-text-muted dark:text-slate-400">Status</dt><dd class="mt-1"><span class="rounded-full px-2 py-1 text-xs ' + statusClass + '">' + escapeHtml(teacher.status) + '</span></dd></div></dl></section><section class="rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm"><h2 class="mb-5 text-lg font-semibold">Kelas yang Diampu</h2><p class="font-semibold">' + escapeHtml(teacher.kelas) + '</p><p class="mt-1 text-sm text-text-muted dark:text-slate-400">' + (classData ? classData.jumlahSiswa : SIATMA_DATA.students.filter((student) => student.kelas === teacher.kelas).length) + ' siswa</p><span class="mt-3 inline-flex rounded-full px-2 py-1 text-xs ' + statusClass + '">' + escapeHtml(teacher.status) + '</span></section></div>';
        }, 300);
      })();
      });
    </script>
      <script>if('serviceWorker' in navigator){var workerPath=/\/(?:admin|guru|orangtua)\//.test(location.pathname)?'../service-worker.js':'service-worker.js';navigator.serviceWorker.register(workerPath).catch(function(error){console.error('Service worker registration failed:',error)})}</script>
  </body>
</html>
