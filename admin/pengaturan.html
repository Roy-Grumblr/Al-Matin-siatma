<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
    <style>
      html.dark { background-color: #0f172a; color: #e2e8f0; }
      html.dark body { background-color: #0f172a; }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo-tk.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengaturan | SIATMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "dark-surface": "#1E293B",
              "dark-bg": "#0F172A",
              "dark-border": "#334155",
              "dark-text": "#F1F5F9",
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
      <style>main{animation:fadeIn .3s ease-in}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
  <style>
html.dark body{background-color:#0f172a!important;color:#e2e8f0!important}
html.dark .bg-bg{background-color:#0f172a!important}
html.dark .bg-white,html.dark .bg-card{background-color:#1e293b!important}

html.dark .text-text-muted{color:#94a3b8!important}

html.dark .border-slate-100,html.dark .border-slate-200,html.dark .border-slate-300,html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#334155!important}

      <style id="global-print-styles">
      @media print {
        #sidebar, #header, .no-print, footer { display: none !important; }
        .ml-64, .ml-0 { margin-left: 0 !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; }
        .print-header { display: flex !important; }
      }
      .print-header { display: none; }
    </style>
  </head>

   <body class="min-h-screen bg-bg dark:bg-slate-900 font-Inter text-text dark:text-slate-100 antialiased">
    <div id="sidebar"></div>

    <div class="ml-64">
      <div id="header"></div>

      <main class="min-h-screen bg-bg dark:bg-slate-900 p-6">
        <div class="print-header mb-6 items-center gap-4 border-b border-slate-300 pb-4">
          <img src="../assets/logo-tk.png" alt="TK Al-Matin" class="h-16 w-auto" />
          <div class="flex-1">
            <h1 class="text-xl font-bold">TK AL-MATIN</h1>
            <p class="text-sm">Jl. Pendidikan No. 123, Jakarta | Telp: 021-1234567</p>
          </div>
          <img src="../assets/logo-unpam.png" alt="UNPAM" class="h-12 w-auto" />
        </div>
        <nav class="mb-6 flex gap-6 border-b border-slate-200 dark:border-slate-700" aria-label="Tab pengaturan">
          <button type="button" data-tab="profil" class="settings-tab border-b-2 border-primary px-1 pb-3 text-sm font-medium text-primary" aria-selected="true">Profil</button>
          <button type="button" data-tab="akun" class="settings-tab px-1 pb-3 text-sm text-text-muted dark:text-slate-400 transition hover:text-primary" aria-selected="false">Akun</button>
          <button type="button" data-tab="password" class="settings-tab px-1 pb-3 text-sm text-text-muted dark:text-slate-400 transition hover:text-primary" aria-selected="false">Password</button>
          <button type="button" data-tab="sistem" class="settings-tab px-1 pb-3 text-sm text-text-muted dark:text-slate-400 transition hover:text-primary" aria-selected="false">Sistem</button>
        </nav>

        <section id="tab-profil" class="settings-panel rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <div class="mb-6 flex flex-wrap items-center gap-4">
            <div id="profile-photo-preview" class="flex h-24 w-24 items-center justify-center rounded-full bg-primary/10 text-2xl font-semibold text-primary">AD</div>
            <input id="profile-photo-input" type="file" accept="image/*" class="hidden" />
            <button id="change-profile-photo" type="button" class="rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm font-medium text-text dark:text-slate-100 transition hover:border-primary hover:text-primary">Ganti Foto</button>
          </div>
          <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div><label for="profile-name" class="mb-1.5 block text-sm font-medium">Nama Lengkap</label><input id="profile-name" type="text" value="Admin Sekolah" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="profile-email" class="mb-1.5 block text-sm font-medium">Email</label><input id="profile-email" type="email" value="admin@almatin.sch.id" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="profile-phone" class="mb-1.5 block text-sm font-medium">Nomor HP</label><input id="profile-phone" type="tel" value="081234567890" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="profile-role" class="mb-1.5 block text-sm font-medium">Jabatan</label><input id="profile-role" type="text" value="Administrator" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
          </div>
          <button id="save-profile-changes" type="button" class="mt-6 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Simpan Perubahan</button>
        </section>

        <section id="tab-akun" class="settings-panel hidden rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <div class="max-w-xl space-y-4">
            <div><label for="account-username" class="mb-1.5 block text-sm font-medium">Username</label><input id="account-username" type="text" value="admin" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="account-email" class="mb-1.5 block text-sm font-medium">Email</label><input id="account-email" type="email" value="admin@almatin.sch.id" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <button type="button" class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Simpan</button>
          </div>
        </section>

        <section id="tab-password" class="settings-panel hidden rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <div class="max-w-xl space-y-4">
            <div><label for="old-password" class="mb-1.5 block text-sm font-medium">Password Lama</label><input id="old-password" type="password" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="new-password" class="mb-1.5 block text-sm font-medium">Password Baru</label><input id="new-password" type="password" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="confirm-password" class="mb-1.5 block text-sm font-medium">Konfirmasi Password Baru</label><input id="confirm-password" type="password" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <button type="button" class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Ubah Password</button>
          </div>
        </section>

        <section id="tab-sistem" class="settings-panel hidden rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <h2 class="mb-5 text-lg font-semibold">Informasi Sekolah</h2>
          <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div><label for="school-name" class="mb-1.5 block text-sm font-medium">Nama Sekolah</label><input id="school-name" type="text" value="TK Al-Matin" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="school-phone" class="mb-1.5 block text-sm font-medium">Telepon</label><input id="school-phone" type="tel" value="021-1234567" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="school-email" class="mb-1.5 block text-sm font-medium">Email</label><input id="school-email" type="email" value="info@almatin.sch.id" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="school-year" class="mb-1.5 block text-sm font-medium">Tahun Ajaran Aktif</label><select id="school-year" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"><option>2025/2026</option><option>2026/2027</option></select></div>
            <div class="md:col-span-2"><label for="school-address" class="mb-1.5 block text-sm font-medium">Alamat</label><textarea id="school-address" rows="3" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">Jl. Pendidikan No. 123, Jakarta</textarea></div>
          </div>
          <button type="button" class="mt-6 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Simpan</button>
        </section>
      </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/network-status.js"></script>
    <script src="../js/pwa-install.js"></script>
    <script src="../js/ui-helpers.js"></script>
    <script src="../js/layout.js"></script>

    <script>
      (function (callback) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', callback);
        else callback();
      })(function () {
const tabs = document.querySelectorAll(".settings-tab");
      const panels = document.querySelectorAll(".settings-panel");
      const saveProfileButton = document.getElementById("save-profile-changes");
      const saveAccountButton = document.querySelector("#tab-akun button");
      const changePasswordButton = document.querySelector("#tab-password button");
      const saveSystemButton = document.querySelector("#tab-sistem button");
      const photoInput = document.getElementById("profile-photo-input");
      const photoPreview = document.getElementById("profile-photo-preview");
      const profileFields = {
        nama: document.getElementById('profile-name'),
        email: document.getElementById('profile-email'),
        nomorHP: document.getElementById('profile-phone'),
        jabatan: document.getElementById('profile-role')
      };
      const accountFields = {
        username: document.getElementById('account-username'),
        email: document.getElementById('account-email')
      };
      const schoolFields = {
        nama: document.getElementById('school-name'),
        telepon: document.getElementById('school-phone'),
        email: document.getElementById('school-email'),
        tahunAjaran: document.getElementById('school-year'),
        alamat: document.getElementById('school-address')
      };
      let photoDataUrl = '';

      function loadSettings(key) {
        try {
          const settings = JSON.parse(localStorage.getItem(key) || '{}');
          if (!settings || typeof settings !== 'object' || Array.isArray(settings)) {
            throw new TypeError('Format pengaturan tidak valid');
          }
          return settings;
        } catch (error) {
          SIATMA_TOAST.error('Gagal memuat pengaturan: ' + error.message);
          return {};
        }
      }

      function populateFields(fields, values) {
        Object.keys(fields).forEach((key) => {
          if (Object.prototype.hasOwnProperty.call(values, key)) fields[key].value = values[key];
        });
      }

      const savedProfile = loadSettings('siatma_profile');
      const savedAccount = loadSettings('siatma_account');
      const savedSchool = loadSettings('siatma_school_settings');
      populateFields(profileFields, savedProfile);
      populateFields(accountFields, savedAccount);
      populateFields(schoolFields, savedSchool);
      const loggedInAdmin = SIATMA_AUTH.getCurrentUser();
      const adminAccount = SIATMA_DATA.users.find((user) => loggedInAdmin && user.role === loggedInAdmin.role);
      if (!savedAccount.username && adminAccount) accountFields.username.value = adminAccount.username;
      if (!savedAccount.email && adminAccount) accountFields.email.value = adminAccount.email || '';
      if (savedProfile.foto) {
        photoDataUrl = savedProfile.foto;
        photoPreview.style.backgroundImage = 'url("' + photoDataUrl + '")';
        photoPreview.style.backgroundSize = 'cover';
        photoPreview.style.backgroundPosition = 'center';
        photoPreview.textContent = '';
      }

      document.getElementById("change-profile-photo").addEventListener("click", () => photoInput.click());
      photoInput.addEventListener("change", () => {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;
        if (!/^image\/(png|jpeg|webp|gif)$/i.test(file.type)) {
          SIATMA_TOAST.error("Pilih file gambar untuk foto profil");
          photoInput.value = "";
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          SIATMA_TOAST.error("Ukuran foto maksimal 2 MB");
          photoInput.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result !== 'string') {
            SIATMA_TOAST.error('Gagal membaca file foto');
            return;
          }
          const updatedProfile = Object.assign({}, loadSettings('siatma_profile'), {
            foto: reader.result
          });
          if (!saveSettings('siatma_profile', updatedProfile, 'Foto profil berhasil diperbarui')) return;
          photoDataUrl = reader.result;
          photoPreview.style.backgroundImage = 'url("' + photoDataUrl + '")';
          photoPreview.style.backgroundSize = "cover";
          photoPreview.style.backgroundPosition = "center";
          photoPreview.textContent = "";
        };
        reader.onerror = () => SIATMA_TOAST.error('Gagal membaca file foto');
        reader.readAsDataURL(file);
      });

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const selectedTab = tab.dataset.tab;

          tabs.forEach((item) => {
            const isActive = item === tab;
            item.classList.toggle("border-b-2", isActive);
            item.classList.toggle("border-primary", isActive);
            item.classList.toggle("font-medium", isActive);
            item.classList.toggle("text-primary", isActive);
            item.classList.toggle("text-text-muted", !isActive);
            item.classList.toggle("dark:text-slate-400", !isActive);
            item.setAttribute("aria-selected", String(isActive));
          });

          panels.forEach((panel) => {
            panel.classList.toggle("hidden", panel.id !== `tab-${selectedTab}`);
          });
        });
      });

      function saveSettings(key, values, successMessage) {
        try {
          localStorage.setItem(key, JSON.stringify(values));
          if (successMessage) SIATMA_TOAST.success(successMessage);
          return true;
        } catch (error) {
          if (error.name === 'QuotaExceededError') {
            SIATMA_TOAST.error('Penyimpanan browser penuh. Hapus data lama atau gunakan mode incognito.');
          } else {
            SIATMA_TOAST.error('Gagal menyimpan data: ' + error.message);
          }
          return false;
        }
      }

      function saveUserOverrides() {
        return saveSettings('siatma_users_override', SIATMA_DATA.users.map((user) => ({
          role: user.role,
          username: user.username,
          email: user.email,
          password: user.password,
          nama: user.nama,
          studentId: user.studentId
        })));
      }

      function updateStoredSession(user) {
        try {
          const storage = localStorage.getItem('siatma_user') ? localStorage : sessionStorage;
          storage.setItem('siatma_user', JSON.stringify(user));
          return true;
        } catch (error) {
          SIATMA_TOAST.error('Gagal memperbarui sesi akun: ' + error.message);
          return false;
        }
      }

      saveProfileButton.addEventListener('click', () => {
        const profile = Object.assign({}, loadSettings('siatma_profile'), {
          nama: profileFields.nama.value.trim(),
          email: profileFields.email.value.trim(),
          nomorHP: profileFields.nomorHP.value.trim(),
          jabatan: profileFields.jabatan.value.trim()
        });
        if (!profile.nama || !profile.email) {
          SIATMA_TOAST.error('Nama dan email profil wajib diisi');
          return;
        }
        if (!saveSettings('siatma_profile', profile, 'Profil berhasil diperbarui')) return;
        accountFields.email.value = profile.email;
        if (!saveSettings('siatma_account', {
          username: accountFields.username.value.trim(),
          email: profile.email
        })) return;
        const currentUser = SIATMA_AUTH.getCurrentUser();
        if (currentUser && currentUser.role === 'admin') {
          const account = SIATMA_DATA.users.find((user) => user.role === currentUser.role);
          if (account) {
            account.nama = profile.nama;
            account.email = profile.email;
            if (!saveUserOverrides()) return;
          }
          currentUser.nama = profile.nama;
          currentUser.email = profile.email;
          if (!updateStoredSession(currentUser)) return;
          const profileButton = document.getElementById('profileMenuButton');
          if (profileButton) {
            profileButton.setAttribute('aria-label', 'Profil ' + profile.nama);
            profileButton.querySelector('span').textContent = profile.nama.charAt(0).toUpperCase();
          }
        }
      });

      saveAccountButton.addEventListener('click', () => {
        const username = accountFields.username.value.trim();
        const email = accountFields.email.value.trim();
        const currentUser = SIATMA_AUTH.getCurrentUser();
        const account = SIATMA_DATA.users.find((user) => currentUser && user.role === currentUser.role);
        if (!account) {
          SIATMA_TOAST.error('Akun yang sedang digunakan tidak ditemukan');
          return;
        }
        if (username.length < 3 || !email) {
          SIATMA_TOAST.error('Username minimal 3 karakter dan email wajib diisi');
          return;
        }
        if (SIATMA_DATA.users.some((user) => user !== account && user.username.toLowerCase() === username.toLowerCase())) {
          SIATMA_TOAST.error('Username sudah digunakan');
          return;
        }
        const previousAccount = { username: account.username, email: account.email };
        account.username = username;
        account.email = email;
        currentUser.username = username;
        currentUser.email = email;
        if (!saveUserOverrides()) {
          Object.assign(account, previousAccount);
          return;
        }
        if (!updateStoredSession(currentUser)) {
          Object.assign(account, previousAccount);
          return;
        }
        saveSettings('siatma_account', { username: username, email: email }, 'Akun berhasil diperbarui');
      });

      changePasswordButton.addEventListener('click', () => {
        const oldPassword = document.getElementById('old-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmation = document.getElementById('confirm-password').value;
        if (!oldPassword || !newPassword || !confirmation) {
          SIATMA_TOAST.error('Semua kolom password wajib diisi');
          return;
        }
        const currentUser = SIATMA_AUTH.getCurrentUser();
        const account = SIATMA_DATA.users.find((user) => currentUser && user.username === currentUser.username);
        if (!account || account.password !== oldPassword) {
          SIATMA_TOAST.error('Password lama tidak sesuai');
          return;
        }
        if (newPassword.length < 6) {
          SIATMA_TOAST.error('Password baru minimal 6 karakter');
          return;
        }
        if (newPassword !== confirmation) {
          SIATMA_TOAST.error('Konfirmasi password baru tidak cocok');
          return;
        }
        const oldAccountPassword = account.password;
        account.password = newPassword;
        if (!saveUserOverrides()) {
          account.password = oldAccountPassword;
          return;
        }
        SIATMA_TOAST.success('Password berhasil diubah');
        document.getElementById('old-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
      });

      saveSystemButton.addEventListener('click', () => saveSettings('siatma_school_settings', {
        nama: document.getElementById('school-name').value.trim(),
        telepon: document.getElementById('school-phone').value.trim(),
        email: document.getElementById('school-email').value.trim(),
        tahunAjaran: document.getElementById('school-year').value,
        alamat: document.getElementById('school-address').value.trim()
      }, 'Informasi sekolah berhasil disimpan'));
      });
    </script>

      <script>if('serviceWorker' in navigator){var workerPath=/\/(?:admin|guru|orangtua)\//.test(location.pathname)?'../service-worker.js':'service-worker.js';navigator.serviceWorker.register(workerPath).catch(function(error){console.error('Service worker registration failed:',error)})}</script>
