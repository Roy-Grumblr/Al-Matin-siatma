<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
    <style>
      html.dark { background-color: #0f172a; color: #e2e8f0; }
      html.dark body { background-color: #0f172a; }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo-tk.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Akun | SIATMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "dark-surface": "#1E293B",
              "dark-bg": "#0F172A",
              "dark-border": "#334155",
              "dark-text": "#F1F5F9",
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
    <style>main{animation:fadeIn .3s ease-in}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
    <style>
      html.dark body{background-color:#0f172a!important;color:#e2e8f0!important}
      html.dark .bg-bg{background-color:#0f172a!important}
      html.dark .bg-white,html.dark .bg-card{background-color:#1e293b!important}
      html.dark .bg-slate-50,html.dark .bg-gray-50{background-color:#334155!important}
      html.dark .text-text{color:#f1f5f9!important}
      html.dark .text-text-muted{color:#94a3b8!important}
      html.dark .text-slate-500,html.dark .text-slate-600,html.dark .text-slate-700,html.dark .text-gray-500,html.dark .text-gray-600,html.dark .text-gray-700{color:#cbd5e1!important}
      html.dark .border-slate-100,html.dark .border-slate-200,html.dark .border-slate-300,html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#334155!important}
      html.dark input:not([type=radio]):not([type=checkbox]),html.dark select,html.dark textarea{background-color:#1e293b;color:#f1f5f9;border-color:#475569}
      html.dark input::placeholder,html.dark textarea::placeholder{color:#94a3b8}
    </style>
    <style id="global-print-styles">
      @media print {
        #sidebar, #header, .no-print, footer { display: none !important; }
        .ml-64, .ml-0 { margin-left: 0 !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; }
      }
    </style>
  </head>

  <body class="min-h-screen bg-bg dark:bg-slate-900 font-Inter text-text dark:text-slate-100 antialiased">
    <div id="sidebar"></div>
    <div class="ml-64">
      <div id="header"></div>
      <main class="min-h-screen bg-bg dark:bg-slate-900 p-6">
        <section class="mb-6 flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-2xl font-bold">Manajemen Akun</h1>
            <p class="mt-1 text-sm text-text-muted dark:text-slate-400">Home / Manajemen Akun</p>
          </div>
          <button id="open-create-modal" type="button" class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">+ Buat Akun Baru</button>
        </section>

        <section class="overflow-hidden rounded-2xl bg-white shadow-sm dark:bg-slate-800" aria-label="Daftar akun">
          <div class="overflow-x-auto">
            <table class="min-w-full text-left">
              <thead class="bg-bg text-sm font-medium uppercase tracking-wide text-text-muted dark:bg-slate-900 dark:text-slate-400">
                <tr>
                  <th scope="col" class="px-4 py-4">No</th>
                  <th scope="col" class="px-4 py-4">Username</th>
                  <th scope="col" class="px-4 py-4">Nama</th>
                  <th scope="col" class="px-4 py-4">Role</th>
                  <th scope="col" class="px-4 py-4">Terhubung ke (siswa)</th>
                  <th scope="col" class="px-4 py-4 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="accounts-table-body" class="divide-y divide-slate-100 text-sm dark:divide-slate-700"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <footer></footer>

    <div id="create-account-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 px-4 py-6" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
      <div class="max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-2xl bg-white shadow-xl dark:bg-slate-800">
        <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 dark:border-slate-700">
          <h2 id="create-modal-title" class="text-lg font-semibold">Buat Akun Baru</h2>
          <button type="button" data-close-modal="create-account-modal" class="text-2xl leading-none text-text-muted transition hover:text-text dark:text-slate-400 dark:hover:text-white" aria-label="Tutup">&times;</button>
        </div>
        <form id="create-account-form" class="space-y-4 p-6">
          <div>
            <label for="new-username" class="mb-1.5 block text-sm font-medium">Username</label>
            <input id="new-username" name="username" type="text" required class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800" />
          </div>
          <div>
            <label for="new-password" class="mb-1.5 block text-sm font-medium">Password</label>
            <input id="new-password" name="password" type="password" required minlength="6" class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800" />
          </div>
          <div>
            <label for="new-name" class="mb-1.5 block text-sm font-medium">Nama Lengkap</label>
            <input id="new-name" name="nama" type="text" required class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800" />
          </div>
          <div>
            <label for="new-role" class="mb-1.5 block text-sm font-medium">Role</label>
            <select id="new-role" name="role" required class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800">
              <option value="admin">Admin</option>
              <option value="guru">Guru</option>
              <option value="orangtua">Orang Tua</option>
            </select>
          </div>
          <div id="student-field" class="hidden">
            <label for="new-student" class="mb-1.5 block text-sm font-medium">Siswa</label>
            <select id="new-student" name="studentId" disabled class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800"></select>
          </div>
          <div class="flex justify-end gap-3 border-t border-slate-200 pt-5 dark:border-slate-700">
            <button type="button" data-close-modal="create-account-modal" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium transition hover:border-primary hover:text-primary dark:border-slate-600 dark:bg-slate-800">Batal</button>
            <button type="submit" class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <div id="reset-password-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 px-4 py-6" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title">
      <div class="w-full max-w-xl rounded-2xl bg-white shadow-xl dark:bg-slate-800">
        <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 dark:border-slate-700">
          <h2 id="reset-modal-title" class="text-lg font-semibold">Reset Password</h2>
          <button type="button" data-close-modal="reset-password-modal" class="text-2xl leading-none text-text-muted transition hover:text-text dark:text-slate-400 dark:hover:text-white" aria-label="Tutup">&times;</button>
        </div>
        <form id="reset-password-form" class="space-y-4 p-6">
          <div>
            <label for="reset-username" class="mb-1.5 block text-sm font-medium">Username</label>
            <input id="reset-username" name="username" type="text" readonly class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-700 dark:bg-slate-900" />
          </div>
          <div>
            <label for="reset-new-password" class="mb-1.5 block text-sm font-medium">Password Baru</label>
            <input id="reset-new-password" name="password" type="password" required minlength="6" class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800" />
          </div>
          <div class="flex justify-end gap-3 border-t border-slate-200 pt-5 dark:border-slate-700">
            <button type="button" data-close-modal="reset-password-modal" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium transition hover:border-primary hover:text-primary dark:border-slate-600 dark:bg-slate-800">Batal</button>
            <button type="submit" class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/network-status.js"></script>
    <script src="../js/pwa-install.js"></script>
    <script src="../js/ui-helpers.js"></script>
    <script src="../js/layout.js"></script>
    <script>
      (function (callback) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', callback);
        else callback();
      })(function () {
        var currentUser = SIATMA_AUTH.getCurrentUser();
        if (!currentUser || currentUser.role !== 'admin') {
          window.location.href = '../index.html';
          return;
        }

        var tbody = document.getElementById('accounts-table-body');
        var createModal = document.getElementById('create-account-modal');
        var resetModal = document.getElementById('reset-password-modal');
        var createForm = document.getElementById('create-account-form');
        var resetForm = document.getElementById('reset-password-form');
        var roleSelect = document.getElementById('new-role');
        var studentField = document.getElementById('student-field');
        var studentSelect = document.getElementById('new-student');
        var resetUsername = document.getElementById('reset-username');
        var deletedUsernames = [];

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        function loadDeletedUsers() {
          try {
            var stored = JSON.parse(window.localStorage.getItem('siatma_users_deleted') || '[]');
            if (!Array.isArray(stored)) throw new TypeError('Format data akun terhapus tidak valid');
            deletedUsernames = stored.filter(function (username) {
              return typeof username === 'string';
            });
            deletedUsernames.forEach(function (username) {
              var user = SIATMA_DATA.users.find(function (item) { return item.username === username; });
              if (user) user.deleted = true;
            });
          } catch (error) {
            SIATMA_TOAST.error('Gagal memuat data akun terhapus: ' + error.message);
          }
        }

        function roleLabel(role) {
          if (role === 'admin') return 'Admin';
          if (role === 'guru') return 'Guru';
          if (role === 'orangtua') return 'Orang Tua';
          return role || '-';
        }

        function renderTable() {
          var users = SIATMA_DATA.users.filter(function (user) { return !user.deleted; });
          if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-text-muted dark:text-slate-400">Belum ada akun.</td></tr>';
            return;
          }
          tbody.innerHTML = users.map(function (user, index) {
            var student = user.studentId ? SIATMA.getStudentById(user.studentId) : null;
            var badgeClass = user.role === 'admin'
              ? 'bg-primary/10 text-primary'
              : user.role === 'guru'
                ? 'bg-secondary/10 text-secondary'
                : 'bg-accent/10 text-accent';
            return '<tr class="hover:bg-slate-50 dark:hover:bg-slate-700">' +
              '<td class="whitespace-nowrap px-4 py-4 text-text-muted dark:text-slate-400">' + (index + 1) + '</td>' +
              '<td class="whitespace-nowrap px-4 py-4 font-medium">' + escapeHtml(user.username) + '</td>' +
              '<td class="px-4 py-4">' + escapeHtml(user.nama) + '</td>' +
              '<td class="px-4 py-4"><span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium ' + badgeClass + '">' + escapeHtml(roleLabel(user.role)) + '</span></td>' +
              '<td class="px-4 py-4">' + escapeHtml(student ? student.nama : '-') + '</td>' +
              '<td class="px-4 py-4"><div class="flex justify-center gap-2">' +
                '<button type="button" data-reset-user="' + escapeHtml(user.username) + '" class="inline-flex items-center gap-1 rounded-lg border border-slate-200 px-2.5 py-2 text-xs font-medium transition hover:border-primary hover:text-primary dark:border-slate-600" aria-label="Reset password ' + escapeHtml(user.username) + '">' +
                  '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 0-5.828-.985L3 11.25v4.5h4.5l1.5-1.5h2.25l1.5-1.5H15a3 3 0 0 0 .75-7.5Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 8.25h.008v.008h-.008z"/></svg>Reset Password</button>' +
                '<button type="button" data-delete-user="' + escapeHtml(user.username) + '" class="inline-flex items-center gap-1 rounded-lg border border-red-200 px-2.5 py-2 text-xs font-medium text-red-600 transition hover:bg-red-50 dark:border-red-900 dark:hover:bg-red-900/20" aria-label="Hapus akun ' + escapeHtml(user.username) + '">' +
                  '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7.5h12m-10.5 0 .75 12h7.5l.75-12M9.75 7.5V4.875A.375.375 0 0 1 10.125 4.5h3.75a.375.375 0 0 1 .375.375V7.5m-4.5 3v5.25m4.5-5.25v5.25"/></svg>Hapus</button>' +
              '</div></td></tr>';
          }).join('');
        }

        function showModal(modal) {
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        }

        function closeModal(modal) {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }

        function updateStudentField() {
          var isParent = roleSelect.value === 'orangtua';
          studentField.classList.toggle('hidden', !isParent);
          studentSelect.disabled = !isParent;
        }

        function populateStudents() {
          studentSelect.innerHTML = '<option value="">Pilih siswa (opsional)</option>' +
            SIATMA_DATA.students.map(function (student) {
              return '<option value="' + Number(student.id) + '">' + escapeHtml(student.nama) + '</option>';
            }).join('');
        }

        document.getElementById('open-create-modal').addEventListener('click', function () {
          createForm.reset();
          updateStudentField();
          showModal(createModal);
          document.getElementById('new-username').focus();
        });
        document.querySelectorAll('[data-close-modal]').forEach(function (button) {
          button.addEventListener('click', function () {
            closeModal(document.getElementById(button.getAttribute('data-close-modal')));
          });
        });
        [createModal, resetModal].forEach(function (modal) {
          modal.addEventListener('click', function (event) {
            if (event.target === modal) closeModal(modal);
          });
        });
        roleSelect.addEventListener('change', updateStudentField);

        createForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var data = {
            username: document.getElementById('new-username').value.trim(),
            password: document.getElementById('new-password').value,
            nama: document.getElementById('new-name').value.trim(),
            role: roleSelect.value
          };
          if (roleSelect.value === 'orangtua' && studentSelect.value) {
            data.studentId = Number(studentSelect.value);
          }
          if (!data.username || !data.nama) {
            SIATMA_TOAST.error('Username dan nama lengkap wajib diisi.');
            return;
          }
          if (!data.password || data.password.length < 6) {
            SIATMA_TOAST.error('Password minimal 6 karakter.');
            return;
          }

          var result = SIATMA.createUser(data);
          if (!result.success) {
            SIATMA_TOAST.error(result.message);
            return;
          }
          SIATMA_TOAST.success('Akun berhasil dibuat.');
          createForm.reset();
          updateStudentField();
          closeModal(createModal);
          renderTable();
        });

        resetForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var result = SIATMA.resetUserPassword(resetUsername.value, document.getElementById('reset-new-password').value);
          if (!result.success) {
            SIATMA_TOAST.error(result.message);
            return;
          }
          SIATMA_TOAST.success('Password berhasil direset.');
          resetForm.reset();
          closeModal(resetModal);
        });

        tbody.addEventListener('click', function (event) {
          var button = event.target.closest('button');
          if (!button) return;
          var username = button.getAttribute('data-reset-user');
          if (username) {
            resetUsername.value = username;
            document.getElementById('reset-new-password').value = '';
            showModal(resetModal);
            document.getElementById('reset-new-password').focus();
            return;
          }

          username = button.getAttribute('data-delete-user');
          if (!username || !window.confirm('Hapus akun ' + username + '?')) return;
          var user = SIATMA_DATA.users.find(function (item) { return item.username === username; });
          if (!user) return;
          var updatedDeletedUsernames = deletedUsernames.indexOf(username) >= 0
            ? deletedUsernames
            : deletedUsernames.concat(username);
          try {
            window.localStorage.setItem('siatma_users_deleted', JSON.stringify(updatedDeletedUsernames));
          } catch (error) {
            SIATMA_TOAST.error('Gagal menyimpan penghapusan akun: ' + error.message);
            return;
          }
          deletedUsernames = updatedDeletedUsernames;
          user.deleted = true;
          SIATMA_TOAST.success('Akun berhasil dihapus.');
          renderTable();
        });

        populateStudents();
        loadDeletedUsers();
        updateStudentField();
        renderTable();
      });
    </script>
  </body>
</html>
