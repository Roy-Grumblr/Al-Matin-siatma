<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
    <style>
      html.dark { background-color: #0f172a; color: #e2e8f0; }
      html.dark body { background-color: #0f172a; }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo-tk.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perkembangan Siswa | SIATMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "dark-surface": "#1E293B",
              "dark-bg": "#0F172A",
              "dark-border": "#334155",
              "dark-text": "#F1F5F9",
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
      <style>main{animation:fadeIn .3s ease-in}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
  <style>
html.dark body{background-color:#0f172a!important;color:#e2e8f0!important}
html.dark .bg-bg{background-color:#0f172a!important}
html.dark .bg-white,html.dark .bg-card{background-color:#1e293b!important}
html.dark .bg-slate-50,html.dark .bg-gray-50{background-color:#334155!important}
html.dark .text-text{color:#f1f5f9!important}
html.dark .text-text-muted{color:#94a3b8!important}
html.dark .text-slate-500,html.dark .text-slate-600,html.dark .text-slate-700,html.dark .text-gray-500,html.dark .text-gray-600,html.dark .text-gray-700{color:#cbd5e1!important}
html.dark .border-slate-100,html.dark .border-slate-200,html.dark .border-slate-300,html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#334155!important}
html.dark input:not([type=radio]):not([type=checkbox]),html.dark select,html.dark textarea{background-color:#1e293b;color:#f1f5f9;border-color:#475569}
html.dark input::placeholder,html.dark textarea::placeholder{color:#94a3b8}
html.dark .hover\:bg-slate-50:hover{background-color:#334155!important}
</style>
      <style id="global-print-styles">
      @media print {
        #sidebar, #header, .no-print, footer { display: none !important; }
        .ml-64, .ml-0 { margin-left: 0 !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; }
        .print-header { display: flex !important; }
      }
      .print-header { display: none; }
    </style>
  </head>

   <body class="min-h-screen bg-bg dark:bg-slate-900 font-Inter text-text dark:text-slate-100 antialiased">
    <div id="sidebar"></div>

    <div class="ml-64">
      <div id="header"></div>

      <main class="min-h-screen bg-bg dark:bg-slate-900 p-6">
        <div class="print-header mb-6 items-center gap-4 border-b border-slate-300 pb-4">
          <img src="../assets/logo-tk.png" alt="TK Al-Matin" class="h-16 w-auto" />
          <div class="flex-1">
            <h1 class="text-xl font-bold">TK AL-MATIN</h1>
            <p class="text-sm">Jl. Pendidikan No. 123, Jakarta | Telp: 021-1234567</p>
          </div>
          <img src="../assets/logo-unpam.png" alt="UNPAM" class="h-12 w-auto" />
        </div>
        <section class="mb-4 rounded-2xl bg-white dark:bg-slate-800 p-4 shadow-sm">
          <div class="flex flex-wrap items-end gap-3">
            <div class="min-w-44 flex-1">
              <label for="class-filter" class="mb-1.5 block text-sm font-medium">Kelas</label>
              <select id="class-filter" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"><option>TK A</option><option>TK B</option><option>Kelompok Bermain</option></select>
            </div>
            <div class="min-w-52 flex-1">
              <label for="student-filter" class="mb-1.5 block text-sm font-medium">Siswa</label>
              <select id="student-filter" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"></select>
            </div>
            <div class="min-w-44 flex-1">
              <label for="period-filter" class="mb-1.5 block text-sm font-medium">Periode</label>
              <input id="period-filter" type="month" value="2026-09" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" />
            </div>
            <button id="load-data" type="button" class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Tampilkan</button>
          </div>
        </section>

        <section class="mb-4 rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <div class="mb-5 flex items-center justify-between">
            <div>
              <h2 class="text-lg font-semibold">Penilaian Perkembangan</h2>
              <p id="assessment-student-heading" class="mt-1 text-sm text-text-muted dark:text-slate-400"></p>
            </div>
            <span id="assessment-status-badge" class="hidden rounded-full px-3 py-1 text-xs font-medium"></span>
          </div>

          <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div><label for="score-absensi" class="mb-1.5 block text-sm font-medium">Absensi <span class="text-text-muted">(bobot 15%)</span></label><input id="score-absensi" type="number" min="0" max="100" step="0.01" placeholder="0-100" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="score-membaca" class="mb-1.5 block text-sm font-medium">Membaca <span class="text-text-muted">(bobot 25%)</span></label><input id="score-membaca" type="number" min="0" max="100" step="0.01" placeholder="0-100" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="score-menulis" class="mb-1.5 block text-sm font-medium">Menulis <span class="text-text-muted">(bobot 25%)</span></label><input id="score-menulis" type="number" min="0" max="100" step="0.01" placeholder="0-100" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <div><label for="score-ujian" class="mb-1.5 block text-sm font-medium">Ujian <span class="text-text-muted">(bobot 35%)</span></label><input id="score-ujian" type="number" min="0" max="100" step="0.01" placeholder="0-100" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
          </div>

          <div class="mt-5 flex flex-wrap items-center gap-3">
            <button id="calculate-wsm" type="button" class="rounded-lg border border-primary px-4 py-2.5 text-sm font-semibold text-primary transition hover:bg-primary/5">Hitung Nilai (WSM)</button>
            <button id="save-assessment" type="button" disabled class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark disabled:cursor-not-allowed disabled:opacity-50">Simpan Penilaian</button>
            <button id="reset-form" type="button" class="rounded-lg border border-slate-300 dark:border-slate-600 px-4 py-2.5 text-sm font-medium transition hover:border-primary hover:text-primary">Reset</button>
            <span id="wsm-result-inline" class="hidden rounded-full bg-primary/10 px-3 py-1 text-sm font-semibold text-primary"></span>
          </div>
          <p id="wsm-formula" class="mt-4 text-xs text-text-muted dark:text-slate-400">Nilai Akhir = (Absensi × 0.15) + (Membaca × 0.25) + (Menulis × 0.25) + (Ujian × 0.35)</p>
        </section>

        <section class="rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <div class="mb-5 flex items-center justify-between">
            <h2 class="text-lg font-semibold">Riwayat Penilaian</h2>
            <span id="assessment-count" class="rounded-full bg-primary/10 px-3 py-1 text-xs font-medium text-primary"></span>
          </div>
          <div id="assessment-history"></div>
        </section>

        <footer class="mt-8 border-t border-slate-200 dark:border-slate-700 pt-4 pb-2">
          <div class="flex flex-wrap items-center justify-center gap-3 text-xs text-text-muted dark:text-slate-400">
            <img src="../assets/logo-tk.png" alt="RA Al-Matin" class="h-6 w-auto" />
            <span>×</span>
            <img src="../assets/logo-unpam.png" alt="Universitas Pamulang" class="h-6 w-auto" />
            <span class="text-text-muted dark:text-slate-500">|</span>
            <span>© 2026 SIATMA - Kerja Praktik Universitas Pamulang</span>
          </div>
        </footer>
      </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/network-status.js"></script>
    <script src="../js/pwa-install.js"></script>
    <script src="../js/ui-helpers.js"></script>
    <script src="../js/layout.js"></script>

    <script>
      (function (callback) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', callback);
        else callback();
      })(function () {
(function() {
      var classFilter = document.getElementById('class-filter');
      var studentFilter = document.getElementById('student-filter');
      var periodFilter = document.getElementById('period-filter');
      var loadBtn = document.getElementById('load-data');
      var scoreAbsensi = document.getElementById('score-absensi');
      var scoreMembaca = document.getElementById('score-membaca');
      var scoreMenulis = document.getElementById('score-menulis');
      var scoreUjian = document.getElementById('score-ujian');
      var calculateBtn = document.getElementById('calculate-wsm');
      var saveBtn = document.getElementById('save-assessment');
      var resetBtn = document.getElementById('reset-form');
      var resultInline = document.getElementById('wsm-result-inline');
      var historyContainer = document.getElementById('assessment-history');
      var countBadge = document.getElementById('assessment-count');
      var heading = document.getElementById('assessment-student-heading');
      var statusBadge = document.getElementById('assessment-status-badge');
      var currentUser = SIATMA_AUTH.getCurrentUser();

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      function formatScore(value) {
        var number = Number(value);
        return Number.isFinite(number) ? number.toFixed(2) : '-';
      }

      var currentTeacher = currentUser ? SIATMA_DATA.teachers.find(function (teacher) {
        return teacher.nama === currentUser.nama;
      }) : null;
      if (currentTeacher && Array.prototype.some.call(classFilter.options, function (option) {
        return option.value === currentTeacher.kelas;
      })) {
        classFilter.value = currentTeacher.kelas;
      }

      function populateStudents() {
        var students = SIATMA_DATA.students.filter(function (student) {
          return student.kelas === classFilter.value && student.status === 'Aktif';
        });
        studentFilter.innerHTML = students.length ? students.map(function (student) {
          return '<option value="' + Number(student.id) + '">' + escapeHtml(student.nama) + ' — ' + escapeHtml(student.nis) + '</option>';
        }).join('') : '<option value="">Tidak ada siswa</option>';
      }

      function getCurrentStudent() {
        var id = Number(studentFilter.value);
        return id ? SIATMA.getStudentById(id) : null;
      }

      function validateScores(scores) {
        var keys = ['absensi', 'membaca', 'menulis', 'ujian'];
        for (var i = 0; i < keys.length; i++) {
          var value = scores[keys[i]];
          if (value === '' || value === null || value === undefined) {
            return { valid: false, message: 'Semua kriteria wajib diisi.' };
          }
          var number = Number(value);
          if (!Number.isFinite(number)) {
            return { valid: false, message: 'Nilai harus berupa angka.' };
          }
          if (number < 0 || number > 100) {
            return { valid: false, message: 'Nilai harus berada pada rentang 0–100.' };
          }
        }
        return { valid: true };
      }

      function readScoresFromForm() {
        return {
          absensi: scoreAbsensi.value,
          membaca: scoreMembaca.value,
          menulis: scoreMenulis.value,
          ujian: scoreUjian.value
        };
      }

      function fillForm(scores) {
        scoreAbsensi.value = scores && scores.absensi != null ? scores.absensi : '';
        scoreMembaca.value = scores && scores.membaca != null ? scores.membaca : '';
        scoreMenulis.value = scores && scores.menulis != null ? scores.menulis : '';
        scoreUjian.value = scores && scores.ujian != null ? scores.ujian : '';
      }

      function renderHeading() {
        var student = getCurrentStudent();
        if (!student) {
          heading.textContent = 'Pilih siswa terlebih dahulu.';
          statusBadge.classList.add('hidden');
          return;
        }
        heading.textContent = student.nama + ' — ' + student.kelas + ' — Periode ' + periodFilter.value;
        var latest = SIATMA.getLatestAssessment(student.id);
        if (latest) {
          var info = SIATMA.getAssessmentLabel(latest.finalScore);
          statusBadge.textContent = 'Nilai terakhir: ' + formatScore(latest.finalScore) + ' (' + info.label + ')';
          statusBadge.className = 'rounded-full px-3 py-1 text-xs font-medium ' + {
            green: 'bg-green-100 text-green-700',
            blue: 'bg-blue-100 text-blue-700',
            yellow: 'bg-yellow-100 text-yellow-700',
            red: 'bg-red-100 text-red-700'
          }[info.tone];
        } else {
          statusBadge.classList.add('hidden');
        }
      }

      function renderHistory() {
        var student = getCurrentStudent();
        if (!student) {
          historyContainer.innerHTML = SIATMA_UI.emptyState({ title: 'Pilih siswa terlebih dahulu' });
          countBadge.textContent = '0 penilaian';
          return;
        }
        var list = SIATMA.getAssessmentsByStudent(student.id).slice().sort(function (a, b) {
          return String(b.gradedAt).localeCompare(String(a.gradedAt));
        });
        countBadge.textContent = list.length + ' penilaian';
        if (!list.length) {
          historyContainer.innerHTML = SIATMA_UI.emptyState({
            title: 'Belum ada penilaian',
            description: 'Isi form di atas untuk menambahkan penilaian pertama.'
          });
          return;
        }
        var toneClasses = {
          green: 'bg-green-100 text-green-700',
          blue: 'bg-blue-100 text-blue-700',
          yellow: 'bg-yellow-100 text-yellow-700',
          red: 'bg-red-100 text-red-700'
        };
        historyContainer.innerHTML = list.map(function (assessment) {
          var info = SIATMA.getAssessmentLabel(assessment.finalScore);
          var toneClass = toneClasses[info.tone] || toneClasses.red;
          return '<article class="mb-3 rounded-xl border border-slate-200 dark:border-slate-700 p-4 last:mb-0">' +
            '<div class="flex items-center justify-between gap-3">' +
            '<div><p class="font-semibold">Periode ' + escapeHtml(assessment.period) + '</p>' +
            '<p class="text-xs text-text-muted dark:text-slate-400">Dinilai oleh ' + escapeHtml(assessment.gradedBy) + ' — ' + escapeHtml(SIATMA_UI.formatDate(assessment.gradedAt, 'short')) + '</p></div>' +
            '<span class="rounded-full px-3 py-1 text-sm font-bold ' + toneClass + '">' + formatScore(assessment.finalScore) + '</span>' +
            '</div>' +
            '<dl class="mt-3 grid grid-cols-2 gap-3 text-sm md:grid-cols-4">' +
            '<div><dt class="text-text-muted">Absensi</dt><dd class="font-medium">' + formatScore(assessment.scores && assessment.scores.absensi) + '</dd></div>' +
            '<div><dt class="text-text-muted">Membaca</dt><dd class="font-medium">' + formatScore(assessment.scores && assessment.scores.membaca) + '</dd></div>' +
            '<div><dt class="text-text-muted">Menulis</dt><dd class="font-medium">' + formatScore(assessment.scores && assessment.scores.menulis) + '</dd></div>' +
            '<div><dt class="text-text-muted">Ujian</dt><dd class="font-medium">' + formatScore(assessment.scores && assessment.scores.ujian) + '</dd></div>' +
            '</dl>' +
            '<p class="mt-2 text-xs text-text-muted dark:text-slate-400">' + escapeHtml(info.label) + '</p>' +
            '</article>';
        }).join('');
      }

      function loadStudentData() {
        var student = getCurrentStudent();
        if (student) {
          var periodAssessments = SIATMA.getAssessmentsByStudent(student.id, periodFilter.value).slice().sort(function (a, b) {
            return String(b.gradedAt).localeCompare(String(a.gradedAt));
          });
          fillForm(periodAssessments.length ? periodAssessments[0].scores : null);
        } else {
          fillForm(null);
        }
        renderHeading();
        renderHistory();
        resultInline.classList.add('hidden');
        saveBtn.disabled = true;
      }

      classFilter.addEventListener('change', function () {
        populateStudents();
        loadStudentData();
      });
      studentFilter.addEventListener('change', loadStudentData);
      periodFilter.addEventListener('change', loadStudentData);
      loadBtn.addEventListener('click', loadStudentData);

      [scoreAbsensi, scoreMembaca, scoreMenulis, scoreUjian].forEach(function (input) {
        input.addEventListener('input', function () {
          resultInline.classList.add('hidden');
          saveBtn.disabled = true;
        });
      });

      calculateBtn.addEventListener('click', function () {
        var scores = readScoresFromForm();
        var validation = validateScores(scores);
        if (!validation.valid) {
          SIATMA_TOAST.error(validation.message);
          return;
        }
        var finalScore = SIATMA.calculateWSM({
          absensi: Number(scores.absensi),
          membaca: Number(scores.membaca),
          menulis: Number(scores.menulis),
          ujian: Number(scores.ujian)
        });
        resultInline.textContent = 'Nilai Akhir: ' + formatScore(finalScore);
        resultInline.classList.remove('hidden');
        saveBtn.disabled = false;
      });

      resetBtn.addEventListener('click', function () {
        fillForm(null);
        resultInline.classList.add('hidden');
        saveBtn.disabled = true;
      });

      saveBtn.addEventListener('click', function () {
        if (!currentUser || currentUser.role !== 'guru') {
          SIATMA_TOAST.error('Hanya guru yang dapat menyimpan penilaian.');
          return;
        }
        var student = getCurrentStudent();
        if (!student) {
          SIATMA_TOAST.error('Pilih siswa terlebih dahulu.');
          return;
        }
        var scores = readScoresFromForm();
        var validation = validateScores(scores);
        if (!validation.valid) {
          SIATMA_TOAST.error(validation.message);
          return;
        }
        var period = periodFilter.value || new Date().toISOString().slice(0, 7);
        var numericScores = {
          absensi: Number(scores.absensi),
          membaca: Number(scores.membaca),
          menulis: Number(scores.menulis),
          ujian: Number(scores.ujian)
        };
        var finalScore = SIATMA.calculateWSM(numericScores);

        try {
          var extra = JSON.parse(localStorage.getItem('siatma_assessments_extra') || '[]');
          if (!Array.isArray(extra)) throw new TypeError('Format data penilaian tidak valid');
          var existingIndex = extra.findIndex(function (item) {
            return item.studentId === student.id && item.period === period;
          });
          var existingAssessment = SIATMA_DATA.assessments.find(function (item) {
            return item.studentId === student.id && item.period === period;
          });
          var record = {
            id: existingIndex >= 0 ? extra[existingIndex].id : (existingAssessment ? existingAssessment.id : Date.now()),
            studentId: student.id,
            period: period,
            scores: numericScores,
            finalScore: finalScore,
            gradedBy: currentUser.nama,
            gradedAt: new Date().toISOString()
          };
          if (existingIndex >= 0) {
            extra[existingIndex] = record;
          } else {
            extra.push(record);
          }
          localStorage.setItem('siatma_assessments_extra', JSON.stringify(extra));

          var dataIndex = SIATMA_DATA.assessments.findIndex(function (item) {
            return item.id === record.id;
          });
          if (dataIndex >= 0) SIATMA_DATA.assessments[dataIndex] = record;
          else SIATMA_DATA.assessments.push(record);

          SIATMA_TOAST.success('Penilaian berhasil disimpan. Nilai akhir: ' + formatScore(finalScore));
          renderHeading();
          renderHistory();
          resultInline.textContent = 'Nilai Akhir: ' + formatScore(finalScore);
          resultInline.classList.remove('hidden');
          saveBtn.disabled = true;
        } catch (error) {
          if (error.name === 'QuotaExceededError') {
            SIATMA_TOAST.error('Penyimpanan browser penuh. Hapus data lama atau gunakan mode incognito.');
          } else {
            SIATMA_TOAST.error('Gagal menyimpan: ' + error.message);
          }
        }
      });

      populateStudents();
      loadStudentData();
    })();
      });
    </script>
      <script>if('serviceWorker' in navigator){var workerPath=/\/(?:admin|guru|orangtua)\//.test(location.pathname)?'../service-worker.js':'service-worker.js';navigator.serviceWorker.register(workerPath).catch(function(error){console.error('Service worker registration failed:',error)})}</script>
  </body>
</html>
