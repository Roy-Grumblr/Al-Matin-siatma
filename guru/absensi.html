    <script>
      document.getElementById("set-all-present").addEventListener("click", () => {
        document.querySelectorAll('input[type="radio"][value="hadir"]').forEach((radio) => {
          radio.checked = true;
        });
        SIATMA_TOAST.info('Semua siswa ditandai Hadir');
        var submitBtn = document.querySelector('button[type="submit"]');
        if (submitBtn) submitBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    </script>
    <script>
      SIATMA_LAYOUT.initLayout({
        role: 'guru',
        activeMenu: 'absensi',
        title: 'Absensi Siswa',
        breadcrumb: 'Home / Absensi'
      });
    </script>
    <script>
    (function() {
      var form = document.querySelector('form[action="#"]');
      if (!form) return;

      form.addEventListener('submit', function(e) {
        e.preventDefault();

        var formData = new FormData(form);
        var records = [];

        formData.forEach(function(value, key) {
          if (key.startsWith('status[')) {
            var nis = key.match(/\[(.*?)\]/)[1];
            records.push({ nis: nis, status: value, catatan: formData.get('catatan[' + nis + ']') || '' });
          }
        });

        try {
          var existing = JSON.parse(localStorage.getItem('siatma_attendance') || '[]');
          var today = new Date().toISOString().split('T')[0];
          var kelas = document.getElementById('kelas').value;
          var tanggal = document.getElementById('tanggal').value || today;

          records.forEach(function(r) {
            var idx = existing.findIndex(function(e) {
              return e.nis === r.nis && e.tanggal === tanggal;
            });
            var record = { nis: r.nis, status: r.status, catatan: r.catatan, tanggal: tanggal, kelas: kelas };
            if (idx >= 0) existing[idx] = record;
            else existing.push(record);
          });

          localStorage.setItem('siatma_attendance', JSON.stringify(existing));
          SIATMA_TOAST.success('Absensi kelas ' + kelas + ' berhasil disimpan');
        } catch (err) {
          if (err.name === 'QuotaExceededError') {
            SIATMA_TOAST.error('Penyimpanan browser penuh. Hapus data lama atau gunakan mode incognito.');
          } else {
            SIATMA_TOAST.error('Gagal menyimpan data: ' + err.message);
          }
        }
      });
    })();
    </script>
