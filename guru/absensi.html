<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
    <style>
      html.dark { background-color: #0f172a; color: #e2e8f0; }
      html.dark body { background-color: #0f172a; }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo-tk.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absensi Siswa | SIATMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "dark-surface": "#1E293B",
              "dark-bg": "#0F172A",
              "dark-border": "#334155",
              "dark-text": "#F1F5F9",
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
      <style>main{animation:fadeIn .3s ease-in}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
  <style>
html.dark body{background-color:#0f172a!important;color:#e2e8f0!important}
html.dark .bg-bg{background-color:#0f172a!important}
html.dark .bg-white,html.dark .bg-card{background-color:#1e293b!important}
html.dark .bg-slate-50,html.dark .bg-gray-50{background-color:#334155!important}
html.dark .text-text{color:#f1f5f9!important}
html.dark .text-text-muted{color:#94a3b8!important}
html.dark .text-slate-500,html.dark .text-slate-600,html.dark .text-slate-700,html.dark .text-gray-500,html.dark .text-gray-600,html.dark .text-gray-700{color:#cbd5e1!important}
html.dark .border-slate-100,html.dark .border-slate-200,html.dark .border-slate-300,html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#334155!important}
html.dark input:not([type=radio]):not([type=checkbox]),html.dark select,html.dark textarea{background-color:#1e293b;color:#f1f5f9;border-color:#475569}
html.dark input::placeholder,html.dark textarea::placeholder{color:#94a3b8}
html.dark .hover\:bg-slate-50:hover{background-color:#334155!important}
</style>
      <style id="global-print-styles">
      @media print {
        #sidebar, #header, .no-print, footer { display: none !important; }
        .ml-64, .ml-0 { margin-left: 0 !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; }
        .print-header { display: flex !important; }
      }
      .print-header { display: none; }
    </style>
  </head>

   <body class="min-h-screen bg-bg dark:bg-slate-900 font-Inter text-text dark:text-slate-100 antialiased">
    <div id="sidebar"></div>

    <div class="ml-64">
      <div id="header"></div>

      <main class="min-h-screen bg-bg dark:bg-slate-900 p-6">
        <div class="print-header mb-6 items-center gap-4 border-b border-slate-300 pb-4">
          <img src="../assets/logo-tk.png" alt="TK Al-Matin" class="h-16 w-auto" />
          <div class="flex-1">
            <h1 class="text-xl font-bold">TK AL-MATIN</h1>
            <p class="text-sm">Jl. Pendidikan No. 123, Jakarta | Telp: 021-1234567</p>
          </div>
          <img src="../assets/logo-unpam.png" alt="UNPAM" class="h-12 w-auto" />
        </div>
        <section class="mb-4 rounded-2xl bg-white dark:bg-slate-800 p-4 shadow-sm">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label for="kelas" class="mb-1 block text-sm font-medium">Kelas</label>
              <select id="kelas" class="rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"></select>
            </div>
            <div><label for="tanggal" class="mb-1 block text-sm font-medium">Tanggal</label><input id="tanggal" type="date" class="rounded-lg border border-slate-300 dark:border-slate-600 px-4 py-2.5 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></div>
            <button id="show-attendance" type="button" class="rounded-lg bg-primary px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Tampilkan</button>
          </div>
        </section>

        <form action="#" method="post">
          <section class="overflow-hidden rounded-2xl bg-white dark:bg-slate-800 shadow-sm">
            <div class="overflow-x-auto">
              <table class="min-w-[900px] w-full text-left">
                <thead class="bg-bg dark:bg-slate-900 text-xs font-medium uppercase tracking-wide text-text-muted dark:text-slate-400">
                  <tr><th class="px-6 py-4">No</th><th class="px-6 py-4">Nama Siswa</th><th class="px-6 py-4">Status</th><th class="px-6 py-4">Catatan</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm"></tbody>
              </table>
            </div>
          </section>

          <div class="mt-4 flex flex-col justify-between gap-3 pb-6 sm:flex-row sm:items-center">
            <button type="button" id="set-all-present" class="rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm font-medium text-text dark:text-slate-100 transition hover:border-primary hover:text-primary">Set Semua Hadir</button>
            <button type="submit" class="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark">Simpan Absensi</button>
          </div>
        </form>
      </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/network-status.js"></script>
    <script src="../js/pwa-install.js"></script>
    <script src="../js/ui-helpers.js"></script>
    <script src="../js/layout.js"></script>
    <script>
      SIATMA_LAYOUT.initLayout({
        role: 'guru',
        activeMenu: 'absensi',
        title: 'Absensi Siswa',
        breadcrumb: 'Home / Absensi'
      });
    </script>
    <script>
      (function () {
        var classSelect = document.getElementById('kelas');
        var dateInput = document.getElementById('tanggal');
        var showButton = document.getElementById('show-attendance');
        var tbody = document.querySelector('tbody');
        var form = document.querySelector('form[action="#"]');
        var statuses = [
          { value: 'hadir', label: 'Hadir', classes: 'bg-green-100 text-green-700 peer-checked:ring-green-500' },
          { value: 'sakit', label: 'Sakit', classes: 'bg-yellow-100 text-yellow-700 peer-checked:ring-yellow-500' },
          { value: 'izin', label: 'Izin', classes: 'bg-blue-100 text-blue-700 peer-checked:ring-blue-500' },
          { value: 'alpa', label: 'Alpa', classes: 'bg-red-100 text-red-700 peer-checked:ring-red-500' }
        ];

        var user = SIATMA_AUTH.getCurrentUser();
        var teacher = user ? SIATMA_DATA.teachers.find(function (item) { return item.nama === user.nama; }) : null;
        var defaultClass = teacher ? teacher.kelas : 'TK A';

        SIATMA_DATA.classes.forEach(function (kelas) {
          var option = document.createElement('option');
          option.value = kelas.nama;
          option.textContent = kelas.nama;
          classSelect.appendChild(option);
        });

        var requestedClass = new URLSearchParams(window.location.search).get('kelas');
        if (requestedClass && Array.from(classSelect.options).some(function (option) { return option.value === requestedClass; })) {
          classSelect.value = requestedClass;
        } else if (Array.from(classSelect.options).some(function (option) { return option.value === defaultClass; })) {
          classSelect.value = defaultClass;
        }

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function localDate() {
          var today = new Date();
          return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        }

        function renderStudents(students, tanggal) {
          if (!students.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="p-0">' + SIATMA_UI.emptyState({
              title: 'Data siswa tidak ditemukan',
              description: 'Tidak ada siswa di kelas yang dipilih.'
            }) + '</td></tr>';
            return;
          }
          tbody.innerHTML = students.map(function (student, index) {
            var attendance = SIATMA_DATA.attendance.find(function (record) {
              return record.studentId === student.id && record.tanggal === tanggal;
            });
            var selectedStatus = attendance ? String(attendance.status).toLowerCase() : 'hadir';
            var note = attendance ? attendance.catatan : '';
            return '<tr class="hover:bg-slate-50 dark:hover:bg-slate-700">' +
              '<td class="px-6 py-5 text-text-muted dark:text-slate-400">' + (index + 1) + '</td>' +
              '<td class="px-6 py-5 font-medium">' + escapeHtml(student.nama) + '</td>' +
              '<td class="px-6 py-5"><div class="flex flex-wrap gap-2">' +
              statuses.map(function (status) {
                var checked = selectedStatus === status.value;
                return '<label class="cursor-pointer"><input type="radio" name="status[' + escapeHtml(student.nis) + ']" value="' + status.value + '"' + (checked ? ' checked' : '') + ' class="peer sr-only" /><span class="inline-flex rounded-full px-3 py-1 text-sm ring-0 peer-checked:ring-2 peer-checked:ring-offset-1 ' + status.classes + '">' + status.label + '</span></label>';
              }).join('') +
              '</div></td>' +
              '<td class="px-6 py-5"><input name="catatan[' + escapeHtml(student.nis) + ']" type="text" value="' + escapeHtml(note) + '" placeholder="Tambahkan catatan..." class="w-full min-w-48 rounded-lg border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" /></td>' +
              '</tr>';
          }).join('');
        }

        function refresh() {
          var tanggal = dateInput.value || localDate();
          dateInput.value = tanggal;
          var students = SIATMA_DATA.students.filter(function (student) { return student.kelas === classSelect.value; });
          renderStudents(students, tanggal);
        }

        showButton.addEventListener('click', refresh);
        classSelect.addEventListener('change', refresh);
        dateInput.addEventListener('change', refresh);

        document.getElementById('set-all-present').addEventListener('click', function () {
          document.querySelectorAll('input[type="radio"][value="hadir"]').forEach(function (radio) { radio.checked = true; });
          SIATMA_TOAST.info('Semua siswa ditandai Hadir');
        });

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var formData = new FormData(form);
          var records = [];
          formData.forEach(function (value, key) {
            if (key.startsWith('status[')) {
              var nis = key.match(/\[(.*?)\]/)[1];
              records.push({ nis: nis, status: value, catatan: formData.get('catatan[' + nis + ']') || '' });
            }
          });
          try {
            var existing = JSON.parse(localStorage.getItem('siatma_attendance') || '[]');
            var tanggal = dateInput.value || localDate();
            var kelas = classSelect.value;
            records.forEach(function (record) {
              var index = existing.findIndex(function (item) { return String(item.nis) === String(record.nis) && item.tanggal === tanggal; });
              var attendance = {
                id: index >= 0 ? existing[index].id : Date.now() + records.indexOf(record),
                nis: record.nis,
                status: record.status.charAt(0).toUpperCase() + record.status.slice(1),
                catatan: record.catatan,
                tanggal: tanggal,
                kelas: kelas
              };
              if (index >= 0) existing[index] = attendance;
              else existing.push(attendance);
            });
            localStorage.setItem('siatma_attendance', JSON.stringify(existing));
            records.forEach(function (record) {
              var student = SIATMA_DATA.students.find(function (item) { return String(item.nis) === String(record.nis); });
              if (!student) return;
              var index = SIATMA_DATA.attendance.findIndex(function (item) { return item.studentId === student.id && item.tanggal === tanggal; });
              var attendance = {
                id: index >= 0 ? SIATMA_DATA.attendance[index].id : Date.now(),
                studentId: student.id,
                tanggal: tanggal,
                status: record.status.charAt(0).toUpperCase() + record.status.slice(1),
                catatan: record.catatan
              };
              if (index >= 0) SIATMA_DATA.attendance[index] = attendance;
              else SIATMA_DATA.attendance.push(attendance);
            });
            SIATMA_TOAST.success('Absensi kelas ' + kelas + ' berhasil disimpan');
            refresh();
          } catch (error) {
            if (error.name === 'QuotaExceededError') {
              SIATMA_TOAST.error('Penyimpanan browser penuh. Hapus data lama atau gunakan mode incognito.');
            } else {
              SIATMA_TOAST.error('Gagal menyimpan data: ' + error.message);
            }
          }
        });

        refresh();
      })();
    </script>
      <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){var workerPath=/\/(?:admin|guru|orangtua)\//.test(location.pathname)?'../service-worker.js':'service-worker.js';navigator.serviceWorker.register(workerPath).catch(function(error){console.error('Service worker registration failed:',error)})})}</script>
  </body>
</html>
