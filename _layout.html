<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Template layout admin SIATMA - Sistem Informasi Akademik TK Al-Matin"
    />
    <title>Dashboard | SIATMA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: {
              Inter: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-bg font-Inter text-text antialiased">
    <aside

        <div

          S

        <div>
          <p class="text-lg font-bold tracking-tight text-text">SIATMA</p>
          <p class="text-[10px] font-medium uppercase tracking-wider text-text-muted">
            TK Al-Matin
          </p>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto py-4" aria-label="Menu admin">
        <a
          href="#dashboard"
          class="flex items-center gap-3 rounded-lg bg-primary/10 px-6 py-3 mx-2 text-sm font-medium text-primary"
          aria-current="page"

            xmlns="http://www.w3.org/2000/svg"

            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"

            xmlns="http://www.w3.org/2000/svg"

            fill="none"

            stroke="currentColor"

              stroke-linejoin="round"

          </svg>
          <span>Data Kelas</span>

          href="#absensi"

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-5 w-5 shrink-0"
            aria-hidden="true"

              stroke-linecap="round"

          href="#pengumuman"

        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-5 w-5 shrink-0"
            aria-hidden="true"

              stroke-linecap="round"

        <a
          href="#perkembangan-siswa"
          class="mx-2 flex items-center gap-3 rounded-lg px-6 py-3 text-sm text-text-muted transition hover:bg-primary/5 hover:text-primary"

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"

            <path

        <a

          class="mx-2 flex items-center gap-3 rounded-lg px-6 py-3 text-sm text-text-muted transition hover:bg-primary/5 hover:text-primary"

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"

            />
          </svg>
          <span>Laporan</span>
        </a>

        <a
          href="#pengaturan"
          class="mx-2 flex items-center gap-3 rounded-lg px-6 py-3 text-sm text-text-muted transition hover:bg-primary/5 hover:text-primary"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-5 w-5 shrink-0"
            aria-hidden="true"
          >

      <div class="border-t border-slate-200 px-6 py-4">
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 text-sm font-semibold text-primary"
            aria-label="Avatar Admin"
          >
            A
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-text">Admin</p>
            <p class="truncate text-xs text-text-muted">Administrator</p>
          </div>
          <button
            type="button"
            class="text-text-muted transition hover:text-primary"
            aria-label="Keluar"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="h-5 w-5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"
              />
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="ml-64 min-h-screen">
      <header
        class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-slate-200 bg-white px-6"
      >
        <div class="min-w-0">
          <h1 class="truncate text-xl font-semibold text-text">Dashboard</h1>
          <p class="mt-0.5 truncate text-sm text-text-muted">
            Beranda <span class="mx-1 text-slate-300">/</span> Dashboard
          </p>
        </div>

        <div class="flex items-center gap-5">
          <div class="relative hidden md:block">
            <label for="search" class="sr-only">Cari</label>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-text-muted"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-4.2-4.2m0 0A7.5 7.5 0 1 0 6.194 6.194a7.5 7.5 0 0 0 10.606 10.606Z"
              />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Cari..."
              class="w-56 rounded-lg border border-slate-200 bg-bg py-2 pl-10 pr-4 text-sm text-text outline-none transition placeholder:text-text-muted focus:border-primary focus:ring-2 focus:ring-primary/20"
            />
          </div>

          <button
            type="button"
            class="relative text-text-muted transition hover:text-primary"
            aria-label="Notifikasi"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="h-6 w-6"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9a6 6 0 0 0-12 0v.75a8.967 8.967 0 0 1-2.312 6.022 23.848 23.848 0 0 0 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
              />
            </svg>
            <span
              class="absolute -right-1 -top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-accent px-1 text-[10px] font-bold text-white"
            >
              3
            </span>
          </button>

          <button type="button" aria-label="Profil Admin">
            <span
              class="flex h-9 w-9 items-center justify-center rounded-full bg-primary/10 text-sm font-semibold text-primary"
            >
              A
            </span>
          </button>
        </div>
      </header>

      <main class="min-h-screen bg-bg p-6">
        <!-- CONTENT -->
      </main>

</html>
