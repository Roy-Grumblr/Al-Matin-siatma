<!DOCTYPE html>
<html lang="id">
  <head>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <script>try{if(localStorage.getItem('siatma_theme')==='dark')document.documentElement.classList.add('dark')}catch(error){console.error('Gagal memuat preferensi tema',error)}</script>
    <style>
      html.dark { background-color: #0f172a; color: #e2e8f0; }
      html.dark body { background-color: #0f172a; }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo-tk.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perkembangan Anak | SIATMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "dark-surface": "#1E293B",
              "dark-bg": "#0F172A",
              "dark-border": "#334155",
              "dark-text": "#F1F5F9",
              primary: "#2563EB",
              "primary-dark": "#1E40AF",
              secondary: "#10B981",
              accent: "#F59E0B",
              bg: "#F8FAFC",
              card: "#FFFFFF",
              text: "#1E293B",
              "text-muted": "#64748B",
            },
            fontFamily: { Inter: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
      <style>main{animation:fadeIn .3s ease-in}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
  <style>
html.dark body{background-color:#0f172a!important;color:#e2e8f0!important}
html.dark .bg-bg{background-color:#0f172a!important}
html.dark .bg-white,html.dark .bg-card{background-color:#1e293b!important}
html.dark .bg-slate-50,html.dark .bg-gray-50{background-color:#334155!important}
html.dark .text-text{color:#f1f5f9!important}
html.dark .text-text-muted{color:#94a3b8!important}
html.dark .text-slate-500,html.dark .text-slate-600,html.dark .text-slate-700,html.dark .text-gray-500,html.dark .text-gray-600,html.dark .text-gray-700{color:#cbd5e1!important}
html.dark .border-slate-100,html.dark .border-slate-200,html.dark .border-slate-300,html.dark .divide-slate-100>:not([hidden])~:not([hidden]){border-color:#334155!important}
html.dark input:not([type=radio]):not([type=checkbox]),html.dark select,html.dark textarea{background-color:#1e293b;color:#f1f5f9;border-color:#475569}
html.dark input::placeholder,html.dark textarea::placeholder{color:#94a3b8}
html.dark .hover\:bg-slate-50:hover{background-color:#334155!important}
</style>
      <style id="global-print-styles">
      @media print {
        #sidebar, #header, .no-print, footer { display: none !important; }
        .ml-64, .ml-0 { margin-left: 0 !important; }
        body { background: white !important; color: black !important; }
        main { padding: 0 !important; }
        .print-header { display: flex !important; }
      }
      .print-header { display: none; }
    </style>
  </head>

   <body class="min-h-screen bg-bg dark:bg-slate-900 font-Inter text-text dark:text-slate-100 antialiased">
    <div id="sidebar"></div>

    <div class="ml-64">
      <div id="header"></div>

      <main class="min-h-screen bg-bg dark:bg-slate-900 p-6">
        <div class="print-header mb-6 items-center gap-4 border-b border-slate-300 pb-4">
          <img src="../assets/logo-tk.png" alt="TK Al-Matin" class="h-16 w-auto" />
          <div class="flex-1">
            <h1 class="text-xl font-bold">TK AL-MATIN</h1>
            <p class="text-sm">Jl. Pendidikan No. 123, Jakarta | Telp: 021-1234567</p>
          </div>
          <img src="../assets/logo-unpam.png" alt="UNPAM" class="h-12 w-auto" />
        </div>
        <section class="mb-4 flex items-center gap-4 rounded-2xl bg-white dark:bg-slate-800 p-4 shadow-sm">
          <div id="child-avatar" class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-primary/10 text-lg font-bold text-primary">AP</div>
          <div>
            <h2 id="child-name" class="text-xl font-bold">Aisyah Putri</h2>
            <p id="child-class" class="mt-1 text-sm text-text-muted dark:text-slate-400">Kelas TK A</p>
          </div>
        </section>

        <section id="wsm-result-card" class="mb-4 rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <h2 class="text-lg font-semibold">Hasil Penilaian Perkembangan</h2>
          <p id="wsm-period" class="mt-1 text-sm text-text-muted dark:text-slate-400"></p>
          <div id="wsm-result-content"></div>
        </section>

        <section class="mb-4 grid grid-cols-2 gap-3 md:grid-cols-4">
          <div class="rounded-xl bg-green-50 p-4"><p class="text-sm text-green-700">Absensi</p><p id="score-absensi" class="mt-1 text-2xl font-bold text-green-700">-</p><p class="mt-1 text-xs text-green-600">Bobot 15%</p></div>
          <div class="rounded-xl bg-blue-50 p-4"><p class="text-sm text-blue-700">Membaca</p><p id="score-membaca" class="mt-1 text-2xl font-bold text-blue-700">-</p><p class="mt-1 text-xs text-blue-600">Bobot 25%</p></div>
          <div class="rounded-xl bg-yellow-50 p-4"><p class="text-sm text-yellow-700">Menulis</p><p id="score-menulis" class="mt-1 text-2xl font-bold text-yellow-700">-</p><p class="mt-1 text-xs text-yellow-600">Bobot 25%</p></div>
          <div class="rounded-xl bg-purple-50 p-4"><p class="text-sm text-purple-700">Ujian</p><p id="score-ujian" class="mt-1 text-2xl font-bold text-purple-700">-</p><p class="mt-1 text-xs text-purple-600">Bobot 35%</p></div>
        </section>

        <section class="rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-sm">
          <h2 class="mb-4 text-lg font-semibold">Catatan Perkembangan</h2>
          <div id="development-timeline" class="relative ml-2 border-l border-slate-200 dark:border-slate-700"></div>
        </section>
              <footer class="mt-8 border-t border-slate-200 dark:border-slate-700 pt-4 pb-2">
          <div class="flex flex-wrap items-center justify-center gap-3 text-xs text-text-muted dark:text-slate-400">
            <img src="../assets/logo-tk.png" alt="RA Al-Matin" class="h-6 w-auto" />
            <span>×</span>
            <img src="../assets/logo-unpam.png" alt="Universitas Pamulang" class="h-6 w-auto" />
            <span class="text-text-muted dark:text-slate-500">|</span>
            <span>© 2026 SIATMA - Kerja Praktik Universitas Pamulang</span>
          </div>
        </footer>
      </main>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/ui-helpers.js"></script>
    <script src="../js/layout.js"></script>

    <script>
      (function (callback) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', callback);
        else callback();
      })(function () {
(function () {
        var main = document.querySelector('main');
        var user = SIATMA_AUTH.getCurrentUser();
        var studentId = user && user.studentId ? user.studentId : 2;
        var student = SIATMA.getStudentById(studentId);
        if (!student) {
          main.innerHTML = SIATMA_UI.emptyState({ title: 'Data anak tidak ditemukan' });
          return;
        }

        function escapeHtml(value) {
          return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatScore(value) {
          var number = Number(value);
          return Number.isFinite(number) ? number.toFixed(2) : '-';
        }

        document.getElementById('child-avatar').textContent = student.nama.trim().split(/\s+/).slice(0, 2).map(function (part) {
          return part.charAt(0);
        }).join('').toUpperCase();
        document.getElementById('child-name').textContent = student.nama;
        document.getElementById('child-class').textContent = 'Kelas ' + student.kelas;

        var latest = SIATMA.getLatestAssessment(student.id);
        var contentEl = document.getElementById('wsm-result-content');
        var periodEl = document.getElementById('wsm-period');
        var scoreIds = {
          absensi: 'score-absensi',
          membaca: 'score-membaca',
          menulis: 'score-menulis',
          ujian: 'score-ujian'
        };

        if (!latest) {
          periodEl.textContent = '';
          contentEl.innerHTML = SIATMA_UI.emptyState({
            title: 'Belum ada penilaian',
            description: 'Guru belum melakukan penilaian untuk anak Anda.'
          });
          Object.keys(scoreIds).forEach(function (key) {
            document.getElementById(scoreIds[key]).textContent = '-';
          });
        } else {
          var info = SIATMA.getAssessmentLabel(latest.finalScore);
          periodEl.textContent = 'Periode ' + latest.period + ' — Dinilai oleh ' + latest.gradedBy + ' pada ' + SIATMA_UI.formatDate(latest.gradedAt, 'short');
          contentEl.innerHTML =
            '<div class="mt-4 rounded-2xl bg-gradient-to-br from-primary to-primary-dark p-6 text-white">' +
            '<p class="text-sm opacity-90">Nilai Akhir (WSM)</p>' +
            '<p class="mt-2 text-5xl font-bold">' + formatScore(latest.finalScore) + '</p>' +
            '<p class="mt-2 inline-flex rounded-full bg-white/20 px-3 py-1 text-xs font-medium">' + escapeHtml(info.label) + '</p>' +
            '</div>' +
            '<p class="mt-3 text-xs text-text-muted dark:text-slate-400">Nilai Akhir = (Absensi × 0.15) + (Membaca × 0.25) + (Menulis × 0.25) + (Ujian × 0.35)</p>';

          Object.keys(scoreIds).forEach(function (key) {
            var scores = latest.scores || {};
            document.getElementById(scoreIds[key]).textContent = formatScore(scores[key]);
          });
        }

        var developments = SIATMA.getDevelopmentsByStudent(student.id).slice().sort(function (a, b) {
          return String(b.tanggal).localeCompare(String(a.tanggal));
        });
        var timeline = document.getElementById('development-timeline');
        timeline.innerHTML = developments.length ? developments.map(function (item, index) {
          return '<article class="relative ' + (index === developments.length - 1 ? 'pl-7' : 'pb-6 pl-7') + '">' +
            '<span class="absolute -left-2 top-1 h-4 w-4 rounded-full border-4 border-white ' + ['bg-primary', 'bg-secondary', 'bg-accent', 'bg-purple-500'][index % 4] + '"></span>' +
            '<div class="rounded-lg border-l-4 border-primary bg-bg dark:bg-slate-900 p-4">' +
            '<div class="flex flex-wrap items-center gap-3">' +
            '<p class="font-medium">' + escapeHtml(SIATMA_UI.formatDate(item.tanggal, 'short')) + '</p>' +
            '<span class="rounded-full bg-primary/10 px-2 py-1 text-xs text-primary">' + escapeHtml(item.kategori) + '</span>' +
            '<span class="text-sm text-text-muted dark:text-slate-400">' + escapeHtml(item.guru || '-') + '</span>' +
            '</div>' +
            '<p class="mt-2 text-sm leading-6 text-text-muted dark:text-slate-400">' + escapeHtml(item.catatan) + '</p>' +
            '</div>' +
            '</article>';
        }).join('') : SIATMA_UI.emptyState({ title: 'Belum ada catatan perkembangan', description: 'Catatan guru akan tampil di sini.' });
      })();
      });
    </script>
          <script src="../js/network-status.js"></script>
          <script src="../js/pwa-install.js"></script>
    <script>if('serviceWorker' in navigator){var workerPath=/\/(?:admin|guru|orangtua)\//.test(location.pathname)?'../service-worker.js':'service-worker.js';navigator.serviceWorker.register(workerPath).catch(function(error){console.error('Service worker registration failed:',error)})}</script>
  </body>
</html>
